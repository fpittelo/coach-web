name: Debug Mypy

on:
  push:
    branches: [feature/112-auth-secrets-posture]

permissions:
  contents: read

jobs:
  mypy:
    name: Debug Mypy Output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run mypy and annotate
        run: |
          set +e
          output="$(mypy --strict src/coach_web tests 2>&1)"
          code=$?
          if [ "$code" -ne 0 ]; then
            output="${output//'%'/'%25'}"
            output="${output//$'\n'/'%0A'}"
            output="${output//$'\r'/'%0D'}"
            echo "::error::$output"
            exit 1
          fi
          echo "mypy clean"
