name: Cloud Run Production Deploy

# ---------------------------------------------------------------------------
# Manual production deploy lane — Cloud Run `coach-web-509209` (MADR-0027).
#
# Trigger: workflow_dispatch only (issue #316). main is the only trunk
# (MADR-0017); the deployed artifact is always an exact GHCR sha256 digest:
# the `image_tag_or_digest` input (required on dispatch — no default; #411)
# is resolved via `docker buildx imagetools inspect` and deployed as
# `@sha256:…`. Release-class tags (`prod`, `latest`, `v*`) are REFUSED at
# resolution time — they resolve to the LAST RELEASE build, not the current
# trunk artifact; that stale-release digest caused three live prod incidents
# (runs 44897761116, 44898471542, 45003393040 — issue #411).
#
# Sequencing (Sprint 32 consensus, grooming amendment 2026-11-15): the FIRST
# execution (AC1) must not run before @cyber-security records the AC5 review
# (secret wiring/masking, FORWARDED_ALLOW_IPS=* rationale, IAP enablement +
# both iap.httpsResourceAccessor grants) on the #316 PR.
#
# Auth: keyless Workload Identity Federation only (no SA JSON keys anywhere).
# The `gcp-cloud-run` GitHub Environment is the explicit @fpittelo approval
# gate for every deploy run.
#
# One-time prerequisites (docs/admin_guide.md → Amendment 0001 deltas +
# deploy lane):
#   - 6 Secret Manager secrets filled (#315 PO secret fill)
#   - runtime SA coach-web-runtime: ONLY the 6 per-secret
#     roles/secretmanager.secretAccessor bindings (service identity — no
#     invoker, no IAP, no IAM-mutation roles; MADR-0027 Amendment 0001)
#   - deploy SA: roles/iap.admin (enable IAP + manage per-service grants)
#   - deploy SA: roles/secretmanager.viewer on EACH of the 6 secrets
#     (per-secret metadata viewer — payload values are never accessed)
#   - deploy SA: roles/iam.serviceAccountUser on the runtime SA (actAs
#     bridge — the deploy sets the service's runtime identity; KEEP per
#     MADR-0027 Amendment 0002 D1 — structurally required for
#     `services replace` + serviceAccountName)
#   - deploy SA: roles/run.admin RESOURCE-SCOPED on the coach-web service
#     (MADR-0027 Amendment 0002 — the former project-level binding is
#     removed; docs/admin_guide.md → Amendment 0002 deltas)
#   - deploy SA: roles/resourcemanager.viewer PROJECT-LEVEL (Amendment 0002
#     delta addendum, #407 ruling — the `gcloud iap web …` step performs a
#     project-level Resource Manager lookup previously supplied by the
#     removed project-level run.admin; the role holds exactly
#     resourcemanager.projects.get + projects.list and zero write surface)
#   - Actions variable GOOGLE_OIDC_CLIENT_ID (app-level OAuth client ID)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      image_tag_or_digest:
        description: "coach-web image ref on ghcr.io/fpittelo/coach-web — pass the CURRENT TRUNK DIGEST (sha256:…, see docs/admin_guide.md deploy-lane runbook), the dev tag, or a trunk-build sha tag. Release-class tags (prod, latest, v*) are refused (#411)."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: coach-web-509209
  GCP_REGION: europe-west6
  SERVICE: coach-web
  # Project number of GCP_PROJECT (the same number embedded in WIF_PROVIDER):
  # derives the deterministic second Cloud Run serving URL host
  # ${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app (#406 ruling —
  # Cloud Run serves BOTH URL families; see the render step).
  GCP_PROJECT_NUMBER: 853194930683
  DEPLOY_SA: coach-web-deployer@coach-web-509209.iam.gserviceaccount.com
  # Runtime identity of the service (MADR-0027 Amendment 0001): holds ONLY
  # the six per-secret secretAccessor bindings — no invoker, no IAP, no
  # IAM-mutation roles (service identity, not an invoker).
  RUNTIME_SA: coach-web-runtime@coach-web-509209.iam.gserviceaccount.com
  WIF_PROVIDER: projects/853194930683/locations/global/workloadIdentityPools/github-pool/providers/github-oidc-provider
  IAP_SERVICE_AGENT: serviceAccount:service-853194930683@gcp-sa-iap.iam.gserviceaccount.com
  IAP_PO_USER: user:frederic.pitteloud@gmail.com

jobs:
  # Single approval-gated job (MADR-0027 Amendment 0001 — AC5 fix round):
  # EVERY step that authenticates to GCP — including the secrets pre-flight —
  # runs inside the `gcp-cloud-run` environment job; there is no ungated GCP
  # auth anywhere. GitHub environment approvals are per-JOB, so keeping the
  # whole GCP pipeline in this one job is also what preserves the
  # one-approval-per-deploy-run contract (two gated jobs would prompt twice).
  deploy:
    name: Pre-flight + deploy 3-container pod to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit @fpittelo approval gate — one approval per deploy run.
    environment: gcp-cloud-run
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Grooming amendment #2: the input is resolved to an exact sha256:…
      # digest here (fail fast) and the pinned ref is what ships — no
      # mutable tag ever reaches `gcloud run services replace`.
      - name: Resolve coach-web input to an exact sha256 digest
        id: resolve
        env:
          IMAGE_INPUT: ${{ inputs.image_tag_or_digest }}
        run: |
          set -euo pipefail
          repo="ghcr.io/fpittelo/coach-web"
          # Stale-release guard (#411, @architect ruling): a release-class tag
          # (`prod`, `latest`, `v*`) resolves to the LAST RELEASE build in
          # GHCR, NOT the current trunk artifact — the `prod` default resolved
          # to the stale v0.20.0 digest and caused three live prod incidents
          # (runs 44897761116, 44898471542, 45003393040). Fail the run fast,
          # BEFORE any registry resolution or Cloud Run mutation.
          if [[ "${IMAGE_INPUT}" == "prod" || "${IMAGE_INPUT}" == "latest" || "${IMAGE_INPUT}" =~ ^v[0-9] ]]; then
            echo "::error::Release-class tag '${IMAGE_INPUT}' is refused as a deploy input (#411) — it resolves to the LAST RELEASE image, which is stale (prod incidents: runs 44897761116/44898471542/45003393040). Pass the current trunk digest (sha256:…) or the dev tag — see docs/admin_guide.md → deploy-lane runbook."
            exit 1
          fi
          if [[ "${IMAGE_INPUT}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            ref="${repo}@${IMAGE_INPUT}"
          elif [[ "${IMAGE_INPUT}" =~ ^[0-9a-f]{64}$ ]]; then
            ref="${repo}@sha256:${IMAGE_INPUT}"
          else
            ref="${repo}:${IMAGE_INPUT}"
          fi
          digest="$(docker buildx imagetools inspect "${ref}" | sed -n 's/^Digest:[[:space:]]*//p' || true)"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve ${ref} to a sha256 digest (got: '${digest}'). Check that the tag exists in GHCR and is pullable."
            exit 1
          fi
          echo "Resolved ${ref} -> ${repo}@${digest}"
          echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

      # Sidecar pins (#316): coach-mcp is the separate pipeline's prod lane
      # tag resolved to its current digest; github-mcp is the pinned upstream
      # release — the same constants deploy.yaml verifies (do not re-derive).
      - name: Resolve sidecar image refs
        id: sidecars
        env:
          GITHUB_MCP_REF: ghcr.io/github/github-mcp-server:v1.12.2@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6
        run: |
          set -euo pipefail
          resolve_digest() {
            local ref="$1" digest
            digest="$(docker buildx imagetools inspect "${ref}" | sed -n 's/^Digest:[[:space:]]*//p')"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Failed to resolve a valid digest for ${ref} (got: '${digest}')."
              exit 1
            fi
            echo "${digest}"
          }
          coach_mcp_digest="$(resolve_digest "ghcr.io/fpittelo/coach:prod")"
          echo "coach-mcp resolves: ghcr.io/fpittelo/coach@${coach_mcp_digest}"
          echo "github-mcp pinned:  ${GITHUB_MCP_REF}"
          echo "coach_mcp_ref=ghcr.io/fpittelo/coach@${coach_mcp_digest}" >> "$GITHUB_OUTPUT"
          echo "github_mcp_ref=${GITHUB_MCP_REF}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # Grooming amendment #3: fail fast (5-second error, not a crash loop)
      # when a secret shell is still empty. Requires per-secret
      # roles/secretmanager.viewer bindings for the deploy SA on each of the
      # six secrets (MADR-0027 Amendment 0001 — metadata only, payload values
      # are never accessed; docs/admin_guide.md → Amendment 0001 deltas).
      - name: Fail fast when a Secret Manager shell has no enabled version
        run: |
          set -euo pipefail
          failed=0
          for secret in OPENROUTER_API_KEY GOOGLE_OIDC_CLIENT_SECRET AUTH_SESSION_SECRET GITHUB_TOKEN DATA_ENCRYPTION_KEY INTERVALS_API_KEY; do
            out="$(gcloud secrets versions list "${secret}" \
              --project="${GCP_PROJECT}" \
              --filter='state=ENABLED' --format='value(name)' --limit=1 2>&1 || true)"
            if printf '%s' "${out}" | grep -qi 'PERMISSION_DENIED'; then
              echo "::error::Cannot list versions of ${secret} (PERMISSION_DENIED). One-time grant required: per-secret roles/secretmanager.viewer for ${DEPLOY_SA} on ${secret} (MADR-0027 Amendment 0001 — docs/admin_guide.md → Amendment 0001 deltas)."
              failed=1
            elif [ -z "${out}" ]; then
              echo "::error::Secret ${secret} has no enabled version — fill it once per docs/admin_guide.md → PO secret fill, then re-run."
              failed=1
            else
              echo "secret ${secret}: enabled version present"
            fi
          done
          if [ "${failed}" -ne 0 ]; then exit 1; fi

      - name: Fail fast when the OIDC client id variable is unset
        env:
          OIDC_CLIENT_ID: ${{ vars.GOOGLE_OIDC_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${OIDC_CLIENT_ID}" ]; then
            echo "::error::Repository variable GOOGLE_OIDC_CLIENT_ID is unset — set it once with 'gh variable set GOOGLE_OIDC_CLIENT_ID --repo fpittelo/coach-web <client-id>' (the OAuth web client ID from the #315 IAP prerequisites; it is public, not a secret)."
            exit 1
          fi

      # Grooming amendment #7: capture the revision that was serving before
      # this deploy — the rollback target for the runbook line (NOT a
      # workflow feature; YAGNI).
      - name: Capture pre-deploy state (previous revision, URL)
        id: pre
        run: |
          set -euo pipefail
          prev_revision="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          existing_url="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)' 2>/dev/null || true)"
          echo "previous revision: ${prev_revision:-<first deploy>}"
          echo "existing URL: ${existing_url:-<none>}"
          echo "prev_revision=${prev_revision}" >> "$GITHUB_OUTPUT"
          echo "url=${existing_url}" >> "$GITHUB_OUTPUT"

      # Cloud Run v2 3-container pod, shared localhost namespace. The first
      # container (coach-web) is the ingress container; sidecars are reachable
      # on localhost only. /data is an in-memory (tmpfs) per-instance scratch
      # volume (MADR-0021); scaling is min=0 / max=1; the request timeout is
      # raised to the 3600 s maximum so long agent SSE streams are not cut by
      # the 300 s Cloud Run default (bound documented in docs/admin_guide.md).
      #
      # Runtime identity (MADR-0027 Amendment 0001): the dedicated
      # coach-web-runtime SA is set via `serviceAccountName` —
      # `gcloud run services replace` is YAML-driven and has NO
      # --service-account flag (that flag exists only on `run deploy` /
      # `run services update`); the deployer's roles/iam.serviceAccountUser
      # grant on the runtime SA (Amendment 0001 delta 2) authorizes the set.
      - name: Render the service YAML
        env:
          COACH_WEB_REF: ${{ steps.resolve.outputs.ref }}
          COACH_MCP_REF: ${{ steps.sidecars.outputs.coach_mcp_ref }}
          GITHUB_MCP_REF: ${{ steps.sidecars.outputs.github_mcp_ref }}
          EXISTING_URL: ${{ steps.pre.outputs.url }}
          OIDC_CLIENT_ID: ${{ vars.GOOGLE_OIDC_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${EXISTING_URL}" ]; then
            # C3 (#396, corrected per #406 ruling comment 7061551550): Cloud
            # Run serves the service under TWO URL families — the primary
            # per-service hash form (status.address.url, scraped from the
            # pre-deploy describe in step `pre`) AND the deterministic
            # project-number form
            # ${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app. The
            # exact-match posture is preserved: BOTH served hosts are
            # enumerated explicitly — no wildcard in steady state. The
            # scraped URL stays canonical: AUTH_REDIRECT_URI is pinned to it
            # (single OIDC callback — Google requires exact redirect_uri
            # match), and it is the first CORS origin.
            primary_host="${EXISTING_URL#https://}"
            number_host="${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
            cors_json="[\"${EXISTING_URL}\",\"https://${number_host}\"]"
            redirect_uri="${EXISTING_URL}/auth/callback"
            trusted_hosts="[\"${primary_host}\",\"${number_host}\"]"
          else
            cors_json='["https://pending-first-deploy.run.app"]'
            redirect_uri="https://pending-first-deploy.run.app/auth/callback"
            # Bootstrap fallback ONLY (service — and its hash-bearing URL —
            # does not exist yet): the wildcard is replaced with the exact
            # host list by the first-deploy sync step before the smoke checks
            # (#396 C3, #406). The steady-state deploy path always pins the
            # exact hosts.
            trusted_hosts='["*.run.app"]'
          fi
          cat > "${RUNNER_TEMP}/service.yaml" <<YAML
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: ${SERVICE}
            labels:
              cloud.googleapis.com/location: ${GCP_REGION}
            annotations:
              run.googleapis.com/ingress: all
              run.googleapis.com/description: Coach Web 3-container pod (MADR-0027, #316)
          spec:
            template:
              metadata:
                annotations:
                  autoscaling.knative.dev/minScale: '0'
                  autoscaling.knative.dev/maxScale: '1'
              spec:
                timeoutSeconds: 3600
                serviceAccountName: ${RUNTIME_SA}
                containers:
                - name: coach-web
                  image: ${COACH_WEB_REF}
                  ports:
                  - name: http1
                    containerPort: 8080
                  env:
                  - name: APP_PORT
                    value: '8080'
                  - name: FORWARDED_ALLOW_IPS
                    value: '*'
                  - name: COACH_MCP_URL
                    value: http://localhost:8000/sse
                  - name: GITHUB_MCP_URL
                    value: http://localhost:8001/
                  - name: TRUSTED_HOSTS
                    value: '${trusted_hosts}'
                  - name: CORS_ORIGINS
                    value: '${cors_json}'
                  - name: AUTH_ENABLED
                    value: 'true'
                  - name: AUTH_WHITELIST_EMAILS
                    value: '["frederic.pitteloud@gmail.com"]'
                  - name: AUTH_REDIRECT_URI
                    value: ${redirect_uri}
                  - name: GOOGLE_OIDC_CLIENT_ID
                    value: ${OIDC_CLIENT_ID}
                  - name: OPENROUTER_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: OPENROUTER_API_KEY
                        key: latest
                  - name: GOOGLE_OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: GOOGLE_OIDC_CLIENT_SECRET
                        key: latest
                  - name: AUTH_SESSION_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: AUTH_SESSION_SECRET
                        key: latest
                  - name: DATA_ENCRYPTION_KEY
                    valueFrom:
                      secretKeyRef:
                        name: DATA_ENCRYPTION_KEY
                        key: latest
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 512Mi
                  # /health, not /healthz: Cloud Run reserves URL paths ending
                  # in `z` — the Google Frontend intercepts exact /healthz
                  # with an edge 404 before the container is reached
                  # (cloud.google.com/run/docs/known-issues); /health is the
                  # canonical Cloud Run startup-probe endpoint
                  # (docs: configuring/healthchecks). Deploy run 44815740742:
                  # /health passed 200 through IAP, /healthz 404'd at the
                  # edge (#316).
                  startupProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    initialDelaySeconds: 15
                    periodSeconds: 5
                    failureThreshold: 24
                  volumeMounts:
                  - name: data
                    mountPath: /data
                - name: coach-mcp
                  image: ${COACH_MCP_REF}
                  env:
                  - name: MCP_TRANSPORT
                    value: sse
                  - name: MCP_HOST
                    value: 0.0.0.0
                  - name: MCP_PORT
                    value: '8000'
                  - name: INTERVALS_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: INTERVALS_API_KEY
                        key: latest
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 512Mi
                  startupProbe:
                    tcpSocket:
                      port: 8000
                    initialDelaySeconds: 5
                    periodSeconds: 5
                    failureThreshold: 36
                - name: github-mcp
                  image: ${GITHUB_MCP_REF}
                  # K8s semantics: 'command' REPLACES the image ENTRYPOINT
                  # (/server/github-mcp-server). The compose 'command:' list
                  # is args-to-entrypoint, so it maps to 'args' here — a
                  # 'command: [http, ...]' made Cloud Run exec a binary named
                  # 'http' (issue #316, revision coach-web-00001-qnn).
                  args:
                  - http
                  - --port
                  - '8001'
                  - --listen-host
                  - 0.0.0.0
                  env:
                  - name: GITHUB_PERSONAL_ACCESS_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: GITHUB_TOKEN
                        key: latest
                  - name: GITHUB_TOOLSETS
                    value: default
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 512Mi
                  startupProbe:
                    tcpSocket:
                      port: 8001
                    initialDelaySeconds: 5
                    periodSeconds: 5
                    failureThreshold: 36
                volumes:
                - name: data
                  emptyDir:
                    medium: Memory
                    sizeLimit: 256Mi
          YAML
          echo "Service YAML rendered at ${RUNNER_TEMP}/service.yaml"

      - name: Deploy the service (create or replace)
        run: |
          gcloud run services replace "${RUNNER_TEMP}/service.yaml" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}"

      # MADR-0027 D2: IAP enablement happens in the deploy step; the custom
      # OAuth client was applied at project level (verified 2026-11-15).
      - name: Enable IAP on the service
        run: |
          gcloud run services update "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --iap

      - name: Ensure IAP invoker and edge-access bindings
        run: |
          set -euo pipefail
          # The IAP service agent must hold invocation rights (else every
          # request 403s at invocation).
          gcloud run services add-iam-policy-binding "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --member="${IAP_SERVICE_AGENT}" \
            --role=roles/run.invoker
          # Platform-edge access: the PO account.
          gcloud iap web add-iam-policy-binding \
            --member="${IAP_PO_USER}" \
            --role=roles/iap.httpsResourceAccessor \
            --region="${GCP_REGION}" --resource-type=cloud-run --service="${SERVICE}"
          # Platform-edge access: the WIF deploy SA (smoke identity).
          gcloud iap web add-iam-policy-binding \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role=roles/iap.httpsResourceAccessor \
            --region="${GCP_REGION}" --resource-type=cloud-run --service="${SERVICE}"

      - name: Verify IAP is enforced and the edge is fail-closed
        run: |
          set -euo pipefail
          if ! gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            | grep -q 'Iap Enabled: true'; then
            echo "::error::IAP is not enabled on ${SERVICE} — refusing to smoke-test an unprotected service."
            exit 1
          fi
          if gcloud run services get-iam-policy "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(bindings)' | grep -q '"allUsers"'; then
            echo "::error::An allUsers binding exists on ${SERVICE} — IAP edge must stay fail-closed."
            exit 1
          fi
          # C1 (#396 — cyber sign-off condition, #317 comment 7059788814):
          # the allUsers check alone does not catch allAuthenticatedUsers.
          # The invoker member set must be EXACTLY the IAP service agent —
          # any other principal (a stray allAuthenticatedUsers above all)
          # would make the IAP edge bypassable (the app layer still answers
          # 401, but the zero-trust edge claim is void).
          gcloud run services get-iam-policy "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(bindings)' \
          | INVOKER_EXPECTED="${IAP_SERVICE_AGENT}" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          bindings = (raw.get("bindings", []) if isinstance(raw, dict) else raw)
          invoker = sorted(set(m for b in bindings if b.get("role") == "roles/run.invoker" for m in b.get("members", [])))
          expected = [os.environ["INVOKER_EXPECTED"]]
          if invoker != expected:
              print("::error::C1 violation: roles/run.invoker on " + os.environ["SERVICE"] + " must be held by exactly the IAP service agent — found members=" + json.dumps(invoker) + ", expected=" + json.dumps(expected) + " (allAuthenticatedUsers or any stray invoker would bypass the IAP edge; #317 C1).")
              sys.exit(1)
          print("C1 verified: roles/run.invoker held by exactly the IAP service agent.")
          '
          echo "IAP enforced; no allUsers/allAuthenticatedUsers binding; invoker = IAP service agent only."

      # First deploy only: the .run.app URL is knowable only once the service
      # exists — sync the origin-derived env vars onto the service (a second
      # revision). Steady-state deploys already carry the correct values in
      # the rendered YAML, so this step is skipped. TRUSTED_HOSTS rides along
      # (#396 C3, #406): the bootstrap render carries the '*.run.app' wildcard
      # fallback (the hash-bearing URL does not exist yet); the sync replaces
      # it with the exact two-host list (scraped primary + deterministic
      # project-number form) before the smoke checks and the C2/C3 read-back
      # gate run.
      - name: Sync origin-derived env vars (first deploy)
        if: steps.pre.outputs.url == ''
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)')"
          primary_host="${url#https://}"
          number_host="${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          gcloud run services update "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --update-env-vars="CORS_ORIGINS=[\"${url}\",\"https://${number_host}\"],AUTH_REDIRECT_URI=${url}/auth/callback,TRUSTED_HOSTS=[\"${primary_host}\",\"${number_host}\"]"

      # C2/C3 (#396 — cyber sign-off conditions, #317 comment 7059788814):
      # read the DEPLOYED coach-web container env back from the service
      # (post-sync, so first-deploy placeholder values are already replaced)
      # and fail the run on config drift:
      #   - AUTH_REDIRECT_URI must be present, https and on the service's own
      #     origin — auth/router.py falls back to request.base_url when the
      #     setting is empty, a path influenceable under FORWARDED_ALLOW_IPS=*
      #     (#317 C2; today the value is pinned — the gate keeps it pinned).
      #   - TRUSTED_HOSTS must be exactly the two served hostnames — the
      #     scraped primary hash form AND the deterministic project-number
      #     form (Cloud Run serves both URL families; #406 ruling comment
      #     7061551550). The shared '*.run.app' wildcard is permitted only
      #     for the bootstrap render before the service exists and never
      #     survives to this gate (#317 C3; verified live in #317 that a
      #     spoofed Host is dropped by the GFE, so this stays
      #     defence-in-depth).
      - name: Assert deployed config (AUTH_REDIRECT_URI, TRUSTED_HOSTS)
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)')"
          gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(spec.template.spec.containers)' \
          | SERVICE_URL="${url}" \
            NUMBER_HOST="${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app" python3 -c '
          import json, os, sys
          from urllib.parse import urlparse
          raw = json.load(sys.stdin)
          containers = (raw.get("spec", {}).get("template", {}).get("spec", {}).get("containers", []) if isinstance(raw, dict) else raw)
          env = {}
          for c in containers:
              if c.get("name") == "coach-web":
                  env = {e.get("name"): e.get("value", "") for e in c.get("env", [])}
          if not env:
              print("::error::C2/C3 gate could not read the coach-web container env from the deployed service spec.")
              sys.exit(1)
          origin = os.environ["SERVICE_URL"].rstrip("/")
          host = urlparse(origin).hostname
          number_host = os.environ["NUMBER_HOST"]
          redirect = env.get("AUTH_REDIRECT_URI", "")
          trusted = env.get("TRUSTED_HOSTS", "")
          failed = False
          redirect_ok = (urlparse(redirect).scheme == "https" and redirect == origin + "/auth/callback")
          if not redirect_ok:
              print("::error::C2 violation: deployed AUTH_REDIRECT_URI=" + json.dumps(redirect) + " must be a https URL on the service origin (" + origin + "/auth/callback) — an empty or drifted value lets auth/router.py fall back to request.base_url, influenceable under FORWARDED_ALLOW_IPS=* (#317 C2).")
              failed = True
          expected_hosts = [host, number_host]
          # Compact JSON separators — the rendered env value is bash-built
          # ("[a,b]") while default json.dumps would emit "[a, b]" (space
          # after the comma), a false drift the single-host form never
          # exposed (no separator in a one-element list).
          if trusted != json.dumps(expected_hosts, separators=(",", ":")):
              print("::error::C3 violation: deployed TRUSTED_HOSTS=" + json.dumps(trusted) + " must be exactly " + json.dumps(expected_hosts) + " — the shared *.run.app wildcard matches every Cloud Run service of every GCP project (#317 C3; permitted only for the bootstrap render before the service exists; both served URL forms enumerated per the #406 ruling).")
              failed = True
          if failed:
              sys.exit(1)
          print("C2 verified: AUTH_REDIRECT_URI is https on the service origin. C3 verified: TRUSTED_HOSTS is the exact two-host served list (primary hash form + project-number form).")
          '

      # D4 (MADR-0027 Amendment 0002, issue #390) — post-deploy drift guard:
      # read the DEPLOYED service spec back and fail the run on drift:
      #   - the serving serviceAccountName must be the dedicated runtime SA
      #     (Amendment 0001 identity split) — any other identity re-opens the
      #     Amendment 0001 finding (a deployer-controlled or foreign runtime
      #     identity);
      #   - the env secretKeyRef surface must be EXACTLY the rendered wiring
      #     (6 secrets, per-container): coach-web → OPENROUTER_API_KEY,
      #     GOOGLE_OIDC_CLIENT_SECRET, AUTH_SESSION_SECRET, DATA_ENCRYPTION_KEY;
      #     coach-mcp → INTERVALS_API_KEY; github-mcp → GITHUB_TOKEN exposed
      #     as GITHUB_PERSONAL_ACCESS_TOKEN — any rogue-revision edit of the
      #     wiring (the R1 escalation path, issue #390) fails the run.
      # The ruling's invoker-set assertion is subsumed by the #396 C1 gate
      # above (invoker set == exactly the IAP service agent — a strictly
      # stronger check) and is deliberately NOT duplicated here.
      - name: Assert deployed identity and secret wiring (D4 drift guard, Amendment 0002)
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(spec.template.spec)' \
          | EXPECTED_SA="${RUNTIME_SA}" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          spec = (raw.get("spec", {}).get("template", {}).get("spec", {}) if isinstance(raw, dict) else {})
          expected_sa = os.environ["EXPECTED_SA"]
          expected_wiring = {
              "coach-web": {
                  "OPENROUTER_API_KEY": "OPENROUTER_API_KEY",
                  "GOOGLE_OIDC_CLIENT_SECRET": "GOOGLE_OIDC_CLIENT_SECRET",
                  "AUTH_SESSION_SECRET": "AUTH_SESSION_SECRET",
                  "DATA_ENCRYPTION_KEY": "DATA_ENCRYPTION_KEY",
              },
              "coach-mcp": {"INTERVALS_API_KEY": "INTERVALS_API_KEY"},
              "github-mcp": {"GITHUB_PERSONAL_ACCESS_TOKEN": "GITHUB_TOKEN"},
          }
          failed = False
          sa = spec.get("serviceAccountName", "")
          if sa != expected_sa:
              print("::error::D4 violation: deployed serviceAccountName=" + json.dumps(sa) + " must be the dedicated runtime SA " + json.dumps(expected_sa) + " (Amendment 0001 identity split; a foreign runtime identity re-opens the deploy-SA escalation path — issue #390).")
              failed = True
          wiring = {}
          for c in spec.get("containers", []):
              refs = {}
              for e in c.get("env", []):
                  ref = (e.get("valueFrom") or {}).get("secretKeyRef")
                  if ref:
                      refs[e.get("name")] = ref.get("name")
              wiring[c.get("name")] = refs
          if wiring != expected_wiring:
              print("::error::D4 violation: deployed secretKeyRef wiring drifted — found=" + json.dumps(wiring, sort_keys=True) + ", expected=" + json.dumps(expected_wiring, sort_keys=True) + " (rogue-revision env/secret edits are the R1 escalation path; MADR-0027 Amendment 0002 D4).")
              failed = True
          if failed:
              sys.exit(1)
          print("D4 verified: serving identity is the runtime SA and the 6-secret per-container secretKeyRef wiring is unchanged.")
          '

      # C4 (#396 — cyber sign-off condition, #317 comment 7059788814):
      # the deployer holds roles/iam.serviceAccountUser (actAs) on the
      # runtime SA — required to set serviceAccountName, and harmless ONLY
      # while no principal can mint tokens for that identity: the moment a
      # token-minting grant appears on coach-web-runtime, actAs becomes a
      # direct read path to all 6 app secrets (#317 C4; the denial path was
      # demonstrated live in #317). Assert the runtime-SA policy grants NO
      # token-minting role (roles/iam.serviceAccountTokenCreator /
      # ...AccessTokenCreator / ...OpenIdTokenCreator) to ANY principal.
      # Explicit, justified exclusion (flagged for @cyber-security in the
      # #396 PR): the platform Cloud Run service agent
      # service-853194930683@serverless-robot-prod.iam.gserviceaccount.com —
      # Cloud Run's own runtime-identity mechanism. (Role-NAME matching per
      # the AC; custom roles with equivalent permissions are out of scope.)
      - name: Assert no token-minting grants on the runtime SA
        run: |
          set -euo pipefail
          gcloud iam service-accounts get-iam-policy "${RUNTIME_SA}" \
            --project="${GCP_PROJECT}" \
            --format='json(bindings)' \
          | PLATFORM_AGENT="serviceAccount:service-853194930683@serverless-robot-prod.iam.gserviceaccount.com" \
            RUNTIME_SA="${RUNTIME_SA}" python3 -c '
          import json, os, re, sys
          raw = json.load(sys.stdin)
          bindings = (raw.get("bindings", []) if isinstance(raw, dict) else raw)
          platform = os.environ["PLATFORM_AGENT"]
          minting = re.compile(r"iam\.serviceAccount(Token|AccessToken|OpenIdToken)Creator$")
          violations = []
          platform_only = False
          for b in bindings:
              role = b.get("role", "")
              if not minting.search(role):
                  continue
              members = b.get("members", [])
              if sorted(members) == [platform]:
                  platform_only = True
                  continue
              violations.extend(role + " -> " + m for m in members if m != platform)
          if violations:
              print("::error::C4 violation: token-minting grants exist on " + os.environ["RUNTIME_SA"] + " — the holder(s) can mint access/ID tokens for the runtime identity, turning the deployer actAs bridge into a direct read path to all 6 secrets: " + "; ".join(violations) + " (#317 C4; remove the grant(s), docs/admin_guide.md → Production deploy lane).")
              sys.exit(1)
          if platform_only:
              print("C4 note: a token-minting role is held ONLY by the platform Cloud Run service agent (explicitly excluded — Cloud Run runtime-identity mechanism; flagged for @cyber-security verification, #396).")
          print("C4 verified: no non-platform principal holds token-minting rights on " + os.environ["RUNTIME_SA"] + ".")
          '

      # AC3 (MADR-0027 Amendment 0002 D2, issue #390) — IAM-surface drift
      # gate (BLOCKING — the live migration to the resource-scoped grant was
      # executed 2026-11-21): the deploy SA must hold NO project-level
      # roles/run.admin binding — the grant is resource-scoped on the
      # coach-web service only. roles/run.admin does NOT include
      # resourcemanager.projects.getIamPolicy, so the deploy SA cannot read
      # the project IAM policy to inspect its own bindings; the official
      # TestIamPermissions API (cloudresourcemanager v3) requires NO
      # permission to call and answers directly: a project-level run.admin
      # (re-)grant would surface run.services.getIamPolicy / update / delete
      # (all run.admin signature permissions) on the PROJECT resource, while
      # the resource-scoped binding grants them only on the service itself.
      # Steady state: an EMPTY result — Resource Manager v3 serializes it as
      # `{}` (the repeated `permissions` field is omitted when empty), so
      # exactly `{}` is accepted as the healthy steady state (issue #390
      # reopen, cyber verification comment 7060731941). Fail-closed: an API
      # error or any unexpected response also fails the run.
      - name: Assert no project-level run.admin on the deploy SA (AC3, Amendment 0002)
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            -d '{"permissions":["run.services.getIamPolicy","run.services.update","run.services.delete"]}' \
            "https://cloudresourcemanager.googleapis.com/v3/projects/${GCP_PROJECT}:testIamPermissions" \
          | python3 -c '
          import json, sys
          try:
              raw = json.load(sys.stdin)
          except Exception:
              print("::error::AC3 gate: TestIamPermissions returned a non-JSON response — failing closed (check API availability / auth).")
              sys.exit(1)
          # Minimal safe shape per cyber verification (comment 7060731941):
          # ONLY exactly `{}` is the healthy empty steady state (v3 omits the
          # repeated `permissions` field when empty); ONLY a dict whose sole
          # key is `permissions` with a list value is parsed. EVERY other
          # shape — API-error objects (key `error`), unexpected keys, non-dict
          # bodies, non-list `permissions` — fails closed.
          if raw == {}:
              held = []
          elif isinstance(raw, dict) and set(raw) == {"permissions"} and isinstance(raw["permissions"], list):
              held = raw["permissions"]
          else:
              print("::error::AC3 gate: unexpected TestIamPermissions response shape — failing closed: " + json.dumps(raw)[:300])
              sys.exit(1)
          if held:
              print("::error::AC3 violation: the deploy SA holds project-level run.* permissions " + json.dumps(held) + " on the project — the run.admin grant must be resource-scoped on the coach-web service ONLY (MADR-0027 Amendment 0002 D2; remove the project-level binding per docs/admin_guide.md → Amendment 0002 deltas).")
              sys.exit(1)
          print("AC3 verified: no project-level run.admin-surface permission on the deploy SA (grant is resource-scoped on coach-web).")
          '

      # AC3 (grooming amendment #1) — IAP-aware smoke, no PO browser needed:
      #   1. unauthenticated GET / → IAP edge: 302 (Google sign-in redirect)
      #      or 403; the app is never reached. 200 would mean IAP is not
      #      enforced → hard fail.
      #   2. authorized smoke as the deploy SA (iap.httpsResourceAccessor)
      #      with NO app session cookie: /health → 200 (the probe surface;
      #      /healthz is NOT checked — Cloud Run reserves URL paths ending
      #      in `z` and the GFE intercepts /healthz with an edge 404,
      #      cloud.google.com/run/docs/known-issues);
      #      /api/* → 401 (app-layer boundary; full matrix in #317).
      # The ID-token audience is the IAP OAuth client ID, scraped from the
      # IAP sign-in redirect (fallback: project IAP settings) and asserted
      # equal to the GOOGLE_OIDC_CLIENT_ID Actions variable — a mismatch is
      # IAP settings drift (the same OAuth client must be both the IAP custom
      # client and the app OIDC client). The token is minted by a DIRECT IAM
      # Credentials API call (generateIdToken): a keyless WIF session holds
      # external-account credentials, which `print-identity-token --audiences`
      # rejects ("Invalid account type for --audiences" — deploy attempt #5),
      # and gcloud's --impersonate-service-account shortcut first drives
      # generateAccessToken — PERMISSION_DENIED under the deployer's narrowed
      # self-grant (deploy attempt #7, cyber C1). generateIdToken needs
      # exactly getOpenIdToken: the deployer's self
      # roles/iam.serviceAccountOpenIdTokenCreator (Amendment 0001 delta 6).
      - name: IAP-aware smoke checks
        env:
          GOOGLE_OIDC_CLIENT_ID: ${{ vars.GOOGLE_OIDC_CLIENT_ID }}
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)')"

          unauth_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${url}/")"
          echo "unauthenticated GET / -> HTTP ${unauth_code}"
          if [ "${unauth_code}" != "302" ] && [ "${unauth_code}" != "403" ]; then
            echo "::error::Unauthenticated GET / returned HTTP ${unauth_code} — expected IAP 302/403 at the edge. HTTP 200 would mean IAP is not enforced."
            exit 1
          fi

          redirect="$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 30 "${url}/" || true)"
          client_id="$(printf '%s' "${redirect}" | sed -n 's/.*[?&]client_id=\([^&]*\).*/\1/p' || true)"
          if [ -z "${client_id}" ]; then
            client_id="$(gcloud iap settings get --project="${GCP_PROJECT}" 2>/dev/null \
              | sed -n 's/^.*client_id: *//p' | head -n1 || true)"
          fi
          if [ -z "${client_id}" ]; then
            echo "::error::Could not determine the IAP OAuth client ID (smoke ID-token audience). Check the project-level IAP settings (docs/admin_guide.md → IAP prerequisites)."
            exit 1
          fi

          # Drift guard — BEFORE minting: the scraped client_id must equal the
          # Actions variable (same OAuth client is both the IAP custom client
          # and the app OIDC client; the deployed revision env proves it).
          if [ "${client_id}" != "${GOOGLE_OIDC_CLIENT_ID}" ]; then
            echo "::error::IAP settings drift: the client_id in the IAP sign-in redirect (${client_id}) does not equal the GOOGLE_OIDC_CLIENT_ID Actions variable (${GOOGLE_OIDC_CLIENT_ID}). Re-apply the IAP custom client (docs/admin_guide.md → IAP prerequisites)."
            exit 1
          fi
          echo "IAP OAuth client ID resolved from the sign-in redirect and verified against GOOGLE_OIDC_CLIENT_ID."

          # Direct IAM Credentials API mint — the WIF session's external-account
          # credentials cannot use `--audiences` (requires classic SA-key
          # credentials), and gcloud's SA-impersonation shortcut first drives
          # generateAccessToken (the broader tokenCreator role, deliberately
          # not granted — cyber C1). generateIdToken needs exactly the narrow
          # getOpenIdToken permission: the deployer's self
          # roles/iam.serviceAccountOpenIdTokenCreator grant (delta 6).
          token="$(curl -sS -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${DEPLOY_SA}:generateIdToken" \
            -d "{\"audience\": \"${GOOGLE_OIDC_CLIENT_ID}\", \"includeEmail\": true}" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin).get("token", ""))')"
          echo "::add-mask::${token}"
          if [ -z "${token}" ]; then
            echo "::error::Failed to mint the deploy-SA ID token via the IAM Credentials API — check the deployer's self roles/iam.serviceAccountOpenIdTokenCreator grant (docs/admin_guide.md → Amendment 0001 delta 6)."
            exit 1
          fi

          # IAM/IAP grants propagate asynchronously — retry briefly.
          # No /healthz check: Cloud Run reserves URL paths ending in `z` —
          # the GFE answers exact /healthz with an edge 404 before the
          # container is reached (cloud.google.com/run/docs/known-issues).
          health_code="000"; api_code="000"
          for attempt in 1 2 3 4 5 6; do
            health_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer ${token}" "${url}/health")"
            api_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer ${token}" "${url}/api/agent/stream")"
            echo "attempt ${attempt}: /health=${health_code} /api/agent/stream=${api_code}"
            if [ "${health_code}" = "200" ] && [ "${api_code}" = "401" ]; then
              break
            fi
            sleep 10
          done

          failed=0
          if [ "${health_code}" != "200" ]; then
            echo "::error::Authorized /health expected 200, got ${health_code} (deploy SA carries iap.httpsResourceAccessor; check IAP propagation and app boot logs)."
            failed=1
          fi
          if [ "${api_code}" != "401" ]; then
            echo "::error::Authorized /api/agent/stream without an app session expected 401, got ${api_code}."
            failed=1
          fi
          if [ "${failed}" -ne 0 ]; then exit 1; fi
          {
            echo "SMOKE_URL=${url}"
            echo "SMOKE_UNAUTH=${unauth_code}"
            echo "SMOKE_HEALTH=${health_code}"
            echo "SMOKE_API=${api_code}"
          } >> "$GITHUB_ENV"

      - name: Write job summary
        env:
          PREV_REVISION: ${{ steps.pre.outputs.prev_revision }}
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.latestReadyRevisionName)')"
          {
            echo "## Cloud Run production deploy — ${SERVICE}"
            echo ""
            echo "| Item | Value |"
            echo "|:---|:---|"
            echo "| Service URL | ${SMOKE_URL} |"
            echo "| coach-web image | ${{ steps.resolve.outputs.ref }} |"
            echo "| coach-mcp image | ${{ steps.sidecars.outputs.coach_mcp_ref }} |"
            echo "| github-mcp image | ${{ steps.sidecars.outputs.github_mcp_ref }} |"
            echo "| Serving revision | ${revision} |"
            echo "| Region / project | ${GCP_REGION} / ${GCP_PROJECT} |"
            echo ""
            echo "### IAP-aware smoke matrix (AC3)"
            echo ""
            echo "| Check | Expected | Observed |"
            echo "|:---|:---|:---|"
            echo "| Unauthenticated \`GET /\` | 302/403 (IAP edge) | ${SMOKE_UNAUTH} |"
            echo "| Authorized \`GET /health\` (SA ID token, no app session) | 200 | ${SMOKE_HEALTH} |"
            echo "| Authorized \`GET /api/agent/stream\` (no app session) | 401 | ${SMOKE_API} |"
            if [ -n "${PREV_REVISION}" ]; then
              echo ""
              echo "### Rollback (runbook, docs/admin_guide.md)"
              echo ""
              echo '```bash'
              echo "gcloud run services update-traffic ${SERVICE} --region=${GCP_REGION} --to-revisions=${PREV_REVISION}=100"
              echo '```'
            else
              echo ""
              echo "First deploy — no previous revision to roll back to."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Grooming amendment #3: a fail-closed boot (e.g. AUTH_SESSION_SECRET
      # shorter than 32 bytes) must be visible in the startup-probe failure
      # logs — surface recent revision logs on any failure.
      - name: Dump recent revision logs on failure
        if: failure()
        run: |
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE}\"" \
            --project="${GCP_PROJECT}" --limit=40 \
            --format='value(timestamp, textPayload)' || true
