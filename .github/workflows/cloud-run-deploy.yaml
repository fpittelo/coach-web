name: Cloud Run Production Deploy

# ---------------------------------------------------------------------------
# Manual production deploy lane — Cloud Run `coach-web-509209` (MADR-0027).
#
# Trigger: workflow_dispatch only (issue #316). main is the only trunk
# (MADR-0017); the deployed artifact is always an exact GHCR sha256 digest:
# the `image_tag_or_digest` input (required on dispatch — no default; #411)
# is resolved via `docker buildx imagetools inspect` and deployed as
# `@sha256:…`. Release-class tags (`prod`, `latest`, `v*`) are REFUSED at
# resolution time — they resolve to the LAST RELEASE build, not the current
# trunk artifact; that stale-release digest caused three live prod incidents
# (runs 44897761116, 44898471542, 45003393040 — issue #411).
#
# Sequencing (Sprint 32 consensus, grooming amendment 2026-11-15): the FIRST
# execution (AC1) must not run before @cyber-security records the AC5 review
# (secret wiring/masking, FORWARDED_ALLOW_IPS=* rationale, IAP enablement +
# both iap.httpsResourceAccessor grants) on the #316 PR.
#
# Auth: keyless Workload Identity Federation only (no SA JSON keys anywhere).
# The `gcp-cloud-run` GitHub Environment is the explicit @fpittelo approval
# gate for every deploy run.
#
# One-time prerequisites (docs/admin_guide.md → Amendment 0001 deltas +
# deploy lane + MADR-0031 bootstrap):
#   - 6 Secret Manager secrets filled (#315 PO secret fill)
#   - runtime SA coach-web-runtime: ONLY the 6 per-secret
#     roles/secretmanager.secretAccessor bindings (service identity — no
#     invoker, no IAP, no IAM-mutation roles; MADR-0027 Amendment 0001)
#   - deploy SA: roles/iap.admin RESOURCE-SCOPED on the coach-web IAP
#     webServices resource (the former project-level binding was removed
#     2026-11-22 per MADR-0027 Amendment 0005 / MADR-0031 C4; evidence on #427)
#   - landing SA coach-web-landing: ZERO roles, ZERO keys; the deployer holds
#     ONLY SA-resource-scoped roles/iam.serviceAccountUser +
#     roles/iam.serviceAccountViewer on it (MADR-0031 C1/C2, #427)
#   - landing service coach-web-landing: created ONCE privately by the PO
#     bootstrap (run.services.create is project-level; the deploy SA holds NO
#     project-level run.admin) + resource-scoped roles/run.admin for the
#     deployer ON the landing service (docs/admin_guide.md → MADR-0031
#     bootstrap)
#   - deploy SA: roles/secretmanager.viewer on EACH of the 6 secrets
#     (per-secret metadata viewer — payload values are never accessed)
#   - deploy SA: roles/iam.serviceAccountUser on the runtime SA (actAs
#     bridge — the deploy sets the service's runtime identity; KEEP per
#     MADR-0027 Amendment 0002 D1 — structurally required for
#     `services replace` + serviceAccountName)
#   - deploy SA: roles/run.admin RESOURCE-SCOPED on the coach-web service
#     (MADR-0027 Amendment 0002 — the former project-level binding is
#     removed; docs/admin_guide.md → Amendment 0002 deltas)
#   - deploy SA: roles/resourcemanager.viewer PROJECT-LEVEL (Amendment 0002
#     delta addendum, #407 ruling — the `gcloud iap web …` step performs a
#     project-level Resource Manager lookup previously supplied by the
#     removed project-level run.admin; the role holds exactly
#     resourcemanager.projects.get + projects.list and zero write surface)
#   - deploy SA: projects/coach-web-509209/roles/coachWebProjectIamViewer
#     PROJECT-LEVEL (MADR-0032 C4 — exactly
#     resourcemanager.projects.getIamPolicy, zero write; the ADR-named
#     predefined roles/resourcemanager.projectIamViewer does not exist in
#     GCP, so the @architect-ratified 1-permission custom role replaces it —
#     #417 comments 7078137681 / 7078148984)
#   - snapshot bucket `gs://coach-web-509209-snapshots` bootstrapped with the
#     two bucket-scoped custom-role bindings ONLY (legacyBucket* scrubbed;
#     #417 comment 7078137681)
#   - Actions variable GOOGLE_OIDC_CLIENT_ID (app-level OAuth client ID)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      image_tag_or_digest:
        description: "coach-web image ref on ghcr.io/fpittelo/coach-web — pass the CURRENT TRUNK DIGEST (sha256:…, see docs/admin_guide.md deploy-lane runbook), the dev tag, or a trunk-build sha tag. Release-class tags (prod, latest, v*) are refused (#411)."
        required: true
        type: string
      landing_image_tag_or_digest:
        description: "coach-web-landing image ref on ghcr.io/fpittelo/coach-web-landing — pass the CURRENT TRUNK DIGEST (sha256:…) or the dev tag. Release-class tags (prod, latest, v*) are refused (#411 + MADR-0031 C6). Every deploy ships both surfaces; the landing gates always assert live."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: coach-web-509209
  GCP_REGION: europe-west6
  SERVICE: coach-web
  # Project number of GCP_PROJECT (the same number embedded in WIF_PROVIDER):
  # derives the deterministic second Cloud Run serving URL host
  # ${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app (#406 ruling —
  # Cloud Run serves BOTH URL families; see the render step).
  GCP_PROJECT_NUMBER: 853194930683
  DEPLOY_SA: coach-web-deployer@coach-web-509209.iam.gserviceaccount.com
  # Runtime identity of the service (MADR-0027 Amendment 0001): holds ONLY
  # the six per-secret secretAccessor bindings — no invoker, no IAP, no
  # IAM-mutation roles (service identity, not an invoker).
  RUNTIME_SA: coach-web-runtime@coach-web-509209.iam.gserviceaccount.com
  # Public static landing surface (MADR-0031, #427): separate service with a
  # dedicated ZERO-ROLE service account (C1/C2), invoker exactly allUsers (C3),
  # no IAP annotation (C3), and a CONSTANT canonical CTA target (C7).
  LANDING_SERVICE: coach-web-landing
  LANDING_SA: coach-web-landing@coach-web-509209.iam.gserviceaccount.com
  LANDING_CONSOLE_CTA: https://coach-web-afff35tqxq-oa.a.run.app/auth/login
  WIF_PROVIDER: projects/853194930683/locations/global/workloadIdentityPools/github-pool/providers/github-oidc-provider
  IAP_SERVICE_AGENT: serviceAccount:service-853194930683@gcp-sa-iap.iam.gserviceaccount.com
  IAP_PO_USER: user:frederic.pitteloud@gmail.com
  # Durable snapshot store (MADR-0032, #417): the dedicated regional bucket
  # holding the single whole-file Fernet-encrypted database snapshot.
  SNAPSHOT_BUCKET: coach-web-509209-snapshots
  SNAPSHOT_OBJECT: snapshots/coach.db.fernet

jobs:
  # Single approval-gated job (MADR-0027 Amendment 0001 — AC5 fix round):
  # EVERY step that authenticates to GCP — including the secrets pre-flight —
  # runs inside the `gcp-cloud-run` environment job; there is no ungated GCP
  # auth anywhere. GitHub environment approvals are per-JOB, so keeping the
  # whole GCP pipeline in this one job is also what preserves the
  # one-approval-per-deploy-run contract (two gated jobs would prompt twice).
  deploy:
    name: Pre-flight + deploy 3-container pod to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit @fpittelo approval gate — one approval per deploy run.
    environment: gcp-cloud-run
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Grooming amendment #2: the input is resolved to an exact sha256:…
      # digest here (fail fast) and the pinned ref is what ships — no
      # mutable tag ever reaches `gcloud run services replace`.
      - name: Resolve coach-web input to an exact sha256 digest
        id: resolve
        env:
          IMAGE_INPUT: ${{ inputs.image_tag_or_digest }}
        run: |
          set -euo pipefail
          repo="ghcr.io/fpittelo/coach-web"
          # Stale-release guard (#411, @architect ruling): a release-class tag
          # (`prod`, `latest`, `v*`) resolves to the LAST RELEASE build in
          # GHCR, NOT the current trunk artifact — the `prod` default resolved
          # to the stale v0.20.0 digest and caused three live prod incidents
          # (runs 44897761116, 44898471542, 45003393040). Fail the run fast,
          # BEFORE any registry resolution or Cloud Run mutation.
          if [[ "${IMAGE_INPUT}" == "prod" || "${IMAGE_INPUT}" == "latest" || "${IMAGE_INPUT}" =~ ^v[0-9] ]]; then
            echo "::error::Release-class tag '${IMAGE_INPUT}' is refused as a deploy input (#411) — it resolves to the LAST RELEASE image, which is stale (prod incidents: runs 44897761116/44898471542/45003393040). Pass the current trunk digest (sha256:…) or the dev tag — see docs/admin_guide.md → deploy-lane runbook."
            exit 1
          fi
          if [[ "${IMAGE_INPUT}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            ref="${repo}@${IMAGE_INPUT}"
          elif [[ "${IMAGE_INPUT}" =~ ^[0-9a-f]{64}$ ]]; then
            ref="${repo}@sha256:${IMAGE_INPUT}"
          else
            ref="${repo}:${IMAGE_INPUT}"
          fi
          digest="$(docker buildx imagetools inspect "${ref}" | sed -n 's/^Digest:[[:space:]]*//p' || true)"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve ${ref} to a sha256 digest (got: '${digest}'). Check that the tag exists in GHCR and is pullable."
            exit 1
          fi
          echo "Resolved ${ref} -> ${repo}@${digest}"
          echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

      # MADR-0031 C6: the landing image resolves to an exact sha256 digest with
      # the same stale-release refusal as the console image (#411) — the
      # public surface ships ONLY the release-verified trunk artifact.
      - name: Resolve landing input to an exact sha256 digest
        id: resolve-landing
        env:
          IMAGE_INPUT: ${{ inputs.landing_image_tag_or_digest }}
        run: |
          set -euo pipefail
          repo="ghcr.io/fpittelo/coach-web-landing"
          if [[ "${IMAGE_INPUT}" == "prod" || "${IMAGE_INPUT}" == "latest" || "${IMAGE_INPUT}" =~ ^v[0-9] ]]; then
            echo "::error::Release-class tag '${IMAGE_INPUT}' is refused as a landing deploy input (#411 + MADR-0031 C6) — it resolves to the LAST RELEASE image, not the current trunk artifact. Pass the current trunk digest (sha256:…) or the dev tag."
            exit 1
          fi
          if [[ "${IMAGE_INPUT}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            ref="${repo}@${IMAGE_INPUT}"
          elif [[ "${IMAGE_INPUT}" =~ ^[0-9a-f]{64}$ ]]; then
            ref="${repo}@sha256:${IMAGE_INPUT}"
          else
            ref="${repo}:${IMAGE_INPUT}"
          fi
          digest="$(docker buildx imagetools inspect "${ref}" | sed -n 's/^Digest:[[:space:]]*//p' || true)"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve ${ref} to a sha256 digest (got: '${digest}'). Check that the landing tag exists in GHCR and is pullable."
            exit 1
          fi
          echo "Resolved ${ref} -> ${repo}@${digest}"
          echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

      # Sidecar pins (#316): coach-mcp is the separate pipeline's prod lane
      # tag resolved to its current digest; github-mcp is the pinned upstream
      # release — the same constants deploy.yaml verifies (do not re-derive).
      - name: Resolve sidecar image refs
        id: sidecars
        env:
          GITHUB_MCP_REF: ghcr.io/github/github-mcp-server:v1.12.2@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6
        run: |
          set -euo pipefail
          resolve_digest() {
            local ref="$1" digest
            digest="$(docker buildx imagetools inspect "${ref}" | sed -n 's/^Digest:[[:space:]]*//p')"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Failed to resolve a valid digest for ${ref} (got: '${digest}')."
              exit 1
            fi
            echo "${digest}"
          }
          coach_mcp_digest="$(resolve_digest "ghcr.io/fpittelo/coach:prod")"
          echo "coach-mcp resolves: ghcr.io/fpittelo/coach@${coach_mcp_digest}"
          echo "github-mcp pinned:  ${GITHUB_MCP_REF}"
          echo "coach_mcp_ref=ghcr.io/fpittelo/coach@${coach_mcp_digest}" >> "$GITHUB_OUTPUT"
          echo "github_mcp_ref=${GITHUB_MCP_REF}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # Grooming amendment #3: fail fast (5-second error, not a crash loop)
      # when a secret shell is still empty. Requires per-secret
      # roles/secretmanager.viewer bindings for the deploy SA on each of the
      # six secrets (MADR-0027 Amendment 0001 — metadata only, payload values
      # are never accessed; docs/admin_guide.md → Amendment 0001 deltas).
      - name: Fail fast when a Secret Manager shell has no enabled version
        run: |
          set -euo pipefail
          failed=0
          for secret in OPENROUTER_API_KEY GOOGLE_OIDC_CLIENT_SECRET AUTH_SESSION_SECRET GITHUB_TOKEN DATA_ENCRYPTION_KEY INTERVALS_API_KEY; do
            out="$(gcloud secrets versions list "${secret}" \
              --project="${GCP_PROJECT}" \
              --filter='state=ENABLED' --format='value(name)' --limit=1 2>&1 || true)"
            if printf '%s' "${out}" | grep -qi 'PERMISSION_DENIED'; then
              echo "::error::Cannot list versions of ${secret} (PERMISSION_DENIED). One-time grant required: per-secret roles/secretmanager.viewer for ${DEPLOY_SA} on ${secret} (MADR-0027 Amendment 0001 — docs/admin_guide.md → Amendment 0001 deltas)."
              failed=1
            elif [ -z "${out}" ]; then
              echo "::error::Secret ${secret} has no enabled version — fill it once per docs/admin_guide.md → PO secret fill, then re-run."
              failed=1
            else
              echo "secret ${secret}: enabled version present"
            fi
          done
          if [ "${failed}" -ne 0 ]; then exit 1; fi

      - name: Fail fast when the OIDC client id variable is unset
        env:
          OIDC_CLIENT_ID: ${{ vars.GOOGLE_OIDC_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${OIDC_CLIENT_ID}" ]; then
            echo "::error::Repository variable GOOGLE_OIDC_CLIENT_ID is unset — set it once with 'gh variable set GOOGLE_OIDC_CLIENT_ID --repo fpittelo/coach-web <client-id>' (the OAuth web client ID from the #315 IAP prerequisites; it is public, not a secret)."
            exit 1
          fi

      # MADR-0032 binding conditions C1/C4/C5: the durable snapshot store is
      # asserted BEFORE any service mutation, fail-closed. Three independent
      # read-backs:
      #   1. C4 — coach-web-runtime holds ZERO project-level IAM bindings (its
      #      only storage grant is the bucket-scoped object actor role) and the
      #      deployer still holds the 1-permission project IAM viewer role.
      #   2. C1/C5 — the dedicated bucket is EUROPE-WEST6 REGIONAL, UBLA on,
      #      PAP enforced, versioning on, 7-day Soft Delete, and carries BOTH
      #      noncurrent Delete lifecycle rules (numNewerVersions=2 AND
      #      daysSinceNoncurrentTime=7) bounding history to <= 14 days.
      #   3. C4 — the bucket IAM is EXACTLY the two intended custom-role
      #      bindings (runtime -> object actor, deployer -> bucket reader);
      #      allUsers / allAuthenticatedUsers / any extra role or principal
      #      fails the run. LIVE EVIDENCE @devops 7078137681 (bucket policy
      #      etag `CAs=`): all four auto-populated `legacyBucket*` /
      #      `legacyObject*` bindings were scrubbed — the live policy is
      #      exactly those two bindings, so any reintroduced legacy binding
      #      (or a projectOwner-style convenience grant) must fail closed.
      # Requires the C4 grants: deployer project-level custom role
      # `projects/coach-web-509209/roles/coachWebProjectIamViewer`
      # (`resourcemanager.projects.getIamPolicy` only — the ADR-named
      # predefined `roles/resourcemanager.projectIamViewer` does not exist in
      # GCP; @architect-ratified replacement, #417 comment 7078148984) plus
      # `storage.buckets.get` / `storage.buckets.getIamPolicy` on the bucket
      # (custom bucket reader role).
      - name: Assert snapshot store hardening and snapshot IAM (C1/C4/C5)
        run: |
          set -euo pipefail

          echo "C4 gate: coach-web-runtime must hold zero project-level roles."
          gcloud projects get-iam-policy "${GCP_PROJECT}" \
            --format='json(bindings)' \
          | RUNTIME_MEMBER="serviceAccount:${RUNTIME_SA}" \
            DEPLOY_MEMBER="serviceAccount:${DEPLOY_SA}" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          bindings = (raw.get("bindings", []) if isinstance(raw, dict) else raw)
          runtime = os.environ["RUNTIME_MEMBER"]
          deployer = os.environ["DEPLOY_MEMBER"]
          runtime_roles = sorted(
              binding.get("role", "")
              for binding in bindings
              if runtime in (binding.get("members") or [])
          )
          if runtime_roles:
              print("::error::C4 violation: " + runtime + " holds " + str(len(runtime_roles)) + " project-level role binding(s) " + json.dumps(runtime_roles) + " — the runtime identity must hold zero project-level roles; its only storage grant is the bucket-scoped coachWebSnapshotObjectActor role (MADR-0032 C4).")
              sys.exit(1)
          required = "projects/coach-web-509209/roles/coachWebProjectIamViewer"
          deployer_roles = {
              binding.get("role", "")
              for binding in bindings
              if deployer in (binding.get("members") or [])
          }
          if required not in deployer_roles:
              print("::error::C4 violation: " + deployer + " is missing the project-level " + required + " role — the deploy lane needs resourcemanager.projects.getIamPolicy to keep these gates fail-closed (MADR-0032 C4; recover per docs/admin_guide.md).")
              sys.exit(1)
          print("C4 verified: coach-web-runtime holds zero project-level roles and the deployer holds the 1-permission coachWebProjectIamViewer role.")
          '

          echo "C1/C5 gate: assert the dedicated snapshot bucket posture."
          gcloud storage buckets describe "gs://${SNAPSHOT_BUCKET}" --format=json \
          | python3 -c '
          import json, sys
          raw = json.load(sys.stdin)
          failed = False

          def fail(message):
              global failed
              print("::error::" + message)
              failed = True

          def field(name, *aliases):
              for key in (name, *aliases):
                  if key in raw:
                      return raw[key]
              return None

          def as_int(value):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return -1

          # Accept both the camelCase CLI JSON shape and the snake_case API
          # read-back (the live @devops evidence used the latter) — the gate
          # must never pass on a shape mismatch, only on the real values.
          if field("location") != "EUROPE-WEST6":
              fail("C1 violation: snapshot bucket location=" + json.dumps(field("location")) + " — must be EUROPE-WEST6 (regional Swiss residency; MADR-0032 C1).")
          location_type = field("locationType", "location_type")
          if location_type != "region":
              fail("C1 violation: snapshot bucket locationType=" + json.dumps(location_type) + " — must be \"region\" (never dual/multi-region; MADR-0032 C1).")
          ubla = field("uniformBucketLevelAccess", "uniform_bucket_level_access")
          ubla_enabled = ubla.get("enabled") if isinstance(ubla, dict) else ubla
          if ubla_enabled is not True:
              fail("C1 violation: uniformBucketLevelAccess.enabled must be true on the snapshot bucket (MADR-0032 C1).")
          pap = field("publicAccessPrevention", "public_access_prevention")
          if pap != "enforced":
              fail("C1 violation: publicAccessPrevention=" + json.dumps(pap) + " — must be \"enforced\" (MADR-0032 C1).")
          versioning = field("versioning", "versioning_enabled")
          versioning_enabled = versioning.get("enabled") if isinstance(versioning, dict) else versioning
          if versioning_enabled is not True:
              fail("C5 violation: versioning.enabled must be true on the snapshot bucket (MADR-0032 C5).")
          soft_delete = field("softDeletePolicy", "soft_delete_policy") or {}
          # GCP serializes int64 duration fields as either "604800" or
          # 604800 depending on formatter — int() handles both safely.
          retention = as_int(soft_delete.get("retentionDurationSeconds"))
          if retention != 604800:
              fail("C5 violation: softDeletePolicy.retentionDurationSeconds=" + json.dumps(soft_delete.get("retentionDurationSeconds")) + " — must be 604800 (7 days) on the snapshot bucket (MADR-0032 C5).")

          lifecycle = field("lifecycle", "lifecycle_config") or {}
          rules = lifecycle.get("rule") or []

          def has_delete_rule(num_newer_versions=None, days_since=None):
              for rule in rules:
                  if (rule.get("action") or {}).get("type") != "Delete":
                      continue
                  condition = rule.get("condition") or {}
                  if condition.get("isLive") is not False:
                      continue
                  if num_newer_versions is not None and as_int(condition.get("numNewerVersions")) != num_newer_versions:
                      continue
                  if days_since is not None and as_int(condition.get("daysSinceNoncurrentTime")) != days_since:
                      continue
                  return True
              return False

          if not has_delete_rule(num_newer_versions=2):
              fail("C5 violation: missing the noncurrent Delete lifecycle rule numNewerVersions=2 (MADR-0032 C5).")
          if not has_delete_rule(days_since=7):
              fail("C5 violation: missing the noncurrent Delete lifecycle rule daysSinceNoncurrentTime=7 (MADR-0032 C5).")
          if failed:
              sys.exit(1)
          print("C1/C5 verified: EUROPE-WEST6 regional, UBLA enabled, PAP enforced, versioned, 7-day Soft Delete, both noncurrent Delete rules.")
          '

          echo "C4 gate: assert the exact snapshot bucket IAM allowlist."
          gcloud storage buckets get-iam-policy "gs://${SNAPSHOT_BUCKET}" --format=json \
          | RUNTIME_MEMBER="serviceAccount:${RUNTIME_SA}" \
            DEPLOY_MEMBER="serviceAccount:${DEPLOY_SA}" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          bindings = raw.get("bindings", []) if isinstance(raw, dict) else []
          expected = {
              "projects/coach-web-509209/roles/coachWebSnapshotObjectActor": [os.environ["RUNTIME_MEMBER"]],
              "projects/coach-web-509209/roles/coachWebSnapshotBucketReader": [os.environ["DEPLOY_MEMBER"]],
          }
          found = {}
          violations = []
          for binding in bindings:
              role = binding.get("role", "")
              members = sorted(set(binding.get("members", [])))
              if role in expected:
                  found.setdefault(role, []).extend(members)
              else:
                  violations.append(role + " -> " + ",".join(members))
          for public in ("allUsers", "allAuthenticatedUsers"):
              if any(public in (b.get("members") or []) for b in bindings):
                  violations.append("public principal present: " + public)
          normalized = {role: sorted(set(members)) for role, members in found.items()}
          if normalized != expected:
              violations.append("found=" + json.dumps(normalized, sort_keys=True) + " expected=" + json.dumps(expected, sort_keys=True))
          if violations:
              print("::error::C4 violation: snapshot bucket IAM must be EXACTLY the two intended custom-role bindings (runtime -> coachWebSnapshotObjectActor, deployer -> coachWebSnapshotBucketReader); all legacyBucket*/legacyObject* convenience bindings were scrubbed and must stay removed, and any allUsers/allAuthenticatedUsers or extra role/principal fails closed — " + "; ".join(violations) + " (MADR-0032 C4; recover per docs/admin_guide.md).")
              sys.exit(1)
          print("C4 verified: snapshot bucket IAM is exactly the two intended custom-role bindings.")
          '

      # MADR-0031 C1/C2 (#427, fail-closed pre-deploy — the #396 C4 pattern):
      # the landing runtime identity is a dedicated, purpose-created service
      # account holding ZERO roles. A public container could mint a token for
      # its own identity from the metadata server, so a broad role on this SA
      # would hand a compromise of the PUBLIC surface the inherited permissions
      # (https://docs.cloud.google.com/run/docs/securing/service-identity) —
      # e.g. run.services.setIamPolicy could void the console IAP edge. Three
      # exact read-backs:
      #   1. C1 — coach-web-landing appears in ZERO project-level IAM bindings.
      #   2. C2 — the landing SA policy is EXACTLY the deployer actAs+viewer
      #      bridge (roles/iam.serviceAccountUser + roles/iam.serviceAccountViewer,
      #      the Am. 0003 G2 mirror); any OTHER role fails closed, except a
      #      platform-Cloud-Run-service-agent-only grant which is recorded and
      #      tolerated (the runtime-identity mechanism).
      #   3. C2 — zero user-managed keys on the landing SA (keyless posture).
      # Requires the deployer grants: SA-resource-scoped
      # roles/iam.serviceAccountUser + roles/iam.serviceAccountViewer on
      # coach-web-landing (live evidence on #427, comment 7078710086).
      - name: Assert landing surface IAM (MADR-0031 C1/C2)
        run: |
          set -euo pipefail

          echo "C1 gate: coach-web-landing must hold zero project-level roles."
          gcloud projects get-iam-policy "${GCP_PROJECT}" \
            --format='json(bindings)' \
          | LANDING_MEMBER="serviceAccount:${LANDING_SA}" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          bindings = (raw.get("bindings", []) if isinstance(raw, dict) else raw)
          landing = os.environ["LANDING_MEMBER"]
          roles = sorted(
              binding.get("role", "")
              for binding in bindings
              if landing in (binding.get("members") or [])
          )
          if roles:
              print("::error::C1 violation: " + landing + " holds " + str(len(roles)) + " project-level role binding(s) " + json.dumps(roles) + " — the landing runtime identity must hold zero project-level roles (MADR-0031 C1/C2); remove the binding(s) per docs/admin_guide.md → MADR-0031 bootstrap.")
              sys.exit(1)
          print("C1 verified: coach-web-landing holds zero project-level roles.")
          '

          echo "C2 gate: the landing SA policy must be exactly the deployer actAs+viewer bridge."
          gcloud iam service-accounts get-iam-policy "${LANDING_SA}" \
            --project="${GCP_PROJECT}" \
            --format='json(bindings)' \
          | DEPLOY_MEMBER="serviceAccount:${DEPLOY_SA}" \
            PLATFORM_AGENT="serviceAccount:service-853194930683@serverless-robot-prod.iam.gserviceaccount.com" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          bindings = (raw.get("bindings", []) if isinstance(raw, dict) else raw)
          deployer = os.environ["DEPLOY_MEMBER"]
          platform = os.environ["PLATFORM_AGENT"]
          expected = {
              "roles/iam.serviceAccountUser": [deployer],
              "roles/iam.serviceAccountViewer": [deployer],
          }
          found = {}
          violations = []
          for binding in bindings:
              role = binding.get("role", "")
              members = sorted(set(binding.get("members", [])))
              if role in expected:
                  found.setdefault(role, []).extend(members)
              elif members == [platform]:
                  print("C2 note: platform-only grant tolerated on the landing SA policy: " + role + " (Cloud Run runtime-identity mechanism; flagged for @cyber-security review if unexpected).")
              else:
                  violations.append(role + " -> " + ",".join(members))
          for role, members in expected.items():
              if sorted(set(found.get(role, []))) != members:
                  violations.append("missing or drifted: " + role + " found=" + json.dumps(found.get(role, [])) + " expected=" + json.dumps(members))
          if violations:
              print("::error::C2 violation: the landing SA policy must be EXACTLY the deployer roles/iam.serviceAccountUser + roles/iam.serviceAccountViewer bindings (Am. 0003 G2 mirror) — any extra non-platform principal or role, incl. any token-minting grant, fails closed (MADR-0031 C2): " + "; ".join(violations))
              sys.exit(1)
          print("C2 verified: landing SA policy is exactly the deployer actAs+viewer bridge with zero token-minting grants.")
          '

          echo "C2 gate: coach-web-landing must hold zero user-managed keys."
          keys="$(gcloud iam service-accounts keys list --iam-account="${LANDING_SA}" --project="${GCP_PROJECT}" --managed-by=user --format='json' 2>&1 || true)"
          if [ "${keys}" != "[]" ]; then
            echo "::error::C2 violation: coach-web-landing holds user-managed key material: ${keys} — the landing identity must stay keyless (delete the keys per docs/admin_guide.md → MADR-0031 bootstrap)."
            exit 1
          fi
          echo "C2 verified: zero user-managed keys on coach-web-landing."

      # Grooming amendment #7: capture the revision that was serving before
      # this deploy — the rollback target for the runbook line (NOT a
      # workflow feature; YAGNI).
      - name: Capture pre-deploy state (previous revision, URL)
        id: pre
        run: |
          set -euo pipefail
          prev_revision="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          existing_url="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)' 2>/dev/null || true)"
          echo "previous revision: ${prev_revision:-<first deploy>}"
          echo "existing URL: ${existing_url:-<none>}"
          echo "prev_revision=${prev_revision}" >> "$GITHUB_OUTPUT"
          echo "url=${existing_url}" >> "$GITHUB_OUTPUT"

      # Cloud Run v2 3-container pod, shared localhost namespace. The first
      # container (coach-web) is the ingress container; sidecars are reachable
      # on localhost only. /data is an in-memory (tmpfs) per-instance scratch
      # volume (MADR-0021); scaling is min=0 / max=1; the request timeout is
      # raised to the 3600 s maximum so long agent SSE streams are not cut by
      # the 300 s Cloud Run default (bound documented in docs/admin_guide.md).
      #
      # Runtime identity (MADR-0027 Amendment 0001): the dedicated
      # coach-web-runtime SA is set via `serviceAccountName` —
      # `gcloud run services replace` is YAML-driven and has NO
      # --service-account flag (that flag exists only on `run deploy` /
      # `run services update`); the deployer's roles/iam.serviceAccountUser
      # grant on the runtime SA (Amendment 0001 delta 2) authorizes the set.
      - name: Render the service YAML
        env:
          COACH_WEB_REF: ${{ steps.resolve.outputs.ref }}
          COACH_MCP_REF: ${{ steps.sidecars.outputs.coach_mcp_ref }}
          GITHUB_MCP_REF: ${{ steps.sidecars.outputs.github_mcp_ref }}
          EXISTING_URL: ${{ steps.pre.outputs.url }}
          OIDC_CLIENT_ID: ${{ vars.GOOGLE_OIDC_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${EXISTING_URL}" ]; then
            # C3 (#396, corrected per #406 ruling comment 7061551550): Cloud
            # Run serves the service under TWO URL families — the primary
            # per-service hash form (status.address.url, scraped from the
            # pre-deploy describe in step `pre`) AND the deterministic
            # project-number form
            # ${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app. The
            # exact-match posture is preserved: BOTH served hosts are
            # enumerated explicitly — no wildcard in steady state. The
            # scraped URL stays canonical: AUTH_REDIRECT_URI is pinned to it
            # (single OIDC callback — Google requires exact redirect_uri
            # match), and it is the first CORS origin.
            primary_host="${EXISTING_URL#https://}"
            number_host="${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
            cors_json="[\"${EXISTING_URL}\",\"https://${number_host}\"]"
            redirect_uri="${EXISTING_URL}/auth/callback"
            trusted_hosts="[\"${primary_host}\",\"${number_host}\"]"
          else
            cors_json='["https://pending-first-deploy.run.app"]'
            redirect_uri="https://pending-first-deploy.run.app/auth/callback"
            # Bootstrap fallback ONLY (service — and its hash-bearing URL —
            # does not exist yet): the wildcard is replaced with the exact
            # host list by the first-deploy sync step before the smoke checks
            # (#396 C3, #406). The steady-state deploy path always pins the
            # exact hosts.
            trusted_hosts='["*.run.app"]'
          fi
          cat > "${RUNNER_TEMP}/service.yaml" <<YAML
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: ${SERVICE}
            labels:
              cloud.googleapis.com/location: ${GCP_REGION}
            annotations:
              run.googleapis.com/ingress: all
              run.googleapis.com/description: Coach Web 3-container pod (MADR-0027, #316)
          spec:
            template:
              metadata:
                annotations:
                  autoscaling.knative.dev/minScale: '0'
                  autoscaling.knative.dev/maxScale: '1'
              spec:
                timeoutSeconds: 3600
                serviceAccountName: ${RUNTIME_SA}
                containers:
                - name: coach-web
                  image: ${COACH_WEB_REF}
                  ports:
                  - name: http1
                    containerPort: 8080
                  env:
                  - name: APP_PORT
                    value: '8080'
                  - name: FORWARDED_ALLOW_IPS
                    value: '*'
                  - name: COACH_MCP_URL
                    value: http://localhost:8000/sse
                  - name: GITHUB_MCP_URL
                    value: http://localhost:8001/
                  - name: TRUSTED_HOSTS
                    value: '${trusted_hosts}'
                  - name: CORS_ORIGINS
                    value: '${cors_json}'
                  - name: AUTH_ENABLED
                    value: 'true'
                  - name: AUTH_WHITELIST_EMAILS
                    value: '["frederic.pitteloud@gmail.com"]'
                  - name: AUTH_REDIRECT_URI
                    value: ${redirect_uri}
                  - name: GOOGLE_OIDC_CLIENT_ID
                    value: ${OIDC_CLIENT_ID}
                  - name: OPENROUTER_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: OPENROUTER_API_KEY
                        key: latest
                  - name: GOOGLE_OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: GOOGLE_OIDC_CLIENT_SECRET
                        key: latest
                  - name: AUTH_SESSION_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: AUTH_SESSION_SECRET
                        key: latest
                  - name: DATA_ENCRYPTION_KEY
                    valueFrom:
                      secretKeyRef:
                        name: DATA_ENCRYPTION_KEY
                        key: latest
                  # Durable snapshot store (MADR-0032, #417): the entrypoint
                  # restores before migrations; the debounced publisher
                  # checkpoints committed writes every 60 s.
                  - name: COACH_SNAPSHOT_BUCKET
                    value: ${SNAPSHOT_BUCKET}
                  - name: COACH_SNAPSHOT_OBJECT
                    value: ${SNAPSHOT_OBJECT}
                  - name: COACH_SNAPSHOT_DEBOUNCE_SECONDS
                    value: '60'
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 512Mi
                  # /health, not /healthz: Cloud Run reserves URL paths ending
                  # in `z` — the Google Frontend intercepts exact /healthz
                  # with an edge 404 before the container is reached
                  # (cloud.google.com/run/docs/known-issues); /health is the
                  # canonical Cloud Run startup-probe endpoint
                  # (docs: configuring/healthchecks). Deploy run 44815740742:
                  # /health passed 200 through IAP, /healthz 404'd at the
                  # edge (#316).
                  startupProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    initialDelaySeconds: 15
                    periodSeconds: 5
                    failureThreshold: 24
                  volumeMounts:
                  - name: data
                    mountPath: /data
                - name: coach-mcp
                  image: ${COACH_MCP_REF}
                  env:
                  - name: MCP_TRANSPORT
                    value: sse
                  - name: MCP_HOST
                    value: 0.0.0.0
                  - name: MCP_PORT
                    value: '8000'
                  - name: INTERVALS_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: INTERVALS_API_KEY
                        key: latest
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 512Mi
                  startupProbe:
                    tcpSocket:
                      port: 8000
                    initialDelaySeconds: 5
                    periodSeconds: 5
                    failureThreshold: 36
                - name: github-mcp
                  image: ${GITHUB_MCP_REF}
                  # K8s semantics: 'command' REPLACES the image ENTRYPOINT
                  # (/server/github-mcp-server). The compose 'command:' list
                  # is args-to-entrypoint, so it maps to 'args' here — a
                  # 'command: [http, ...]' made Cloud Run exec a binary named
                  # 'http' (issue #316, revision coach-web-00001-qnn).
                  args:
                  - http
                  - --port
                  - '8001'
                  - --listen-host
                  - 0.0.0.0
                  env:
                  - name: GITHUB_PERSONAL_ACCESS_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: GITHUB_TOKEN
                        key: latest
                  - name: GITHUB_TOOLSETS
                    value: default
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 512Mi
                  startupProbe:
                    tcpSocket:
                      port: 8001
                    initialDelaySeconds: 5
                    periodSeconds: 5
                    failureThreshold: 36
                volumes:
                - name: data
                  emptyDir:
                    medium: Memory
                    sizeLimit: 256Mi
          YAML
          echo "Service YAML rendered at ${RUNNER_TEMP}/service.yaml"

      - name: Deploy the service (create or replace)
        run: |
          gcloud run services replace "${RUNNER_TEMP}/service.yaml" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}"

      # MADR-0027 D2: IAP enablement happens in the deploy step; the custom
      # OAuth client was applied at project level (verified 2026-11-15).
      - name: Enable IAP on the service
        run: |
          gcloud run services update "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --iap

      - name: Ensure IAP invoker and edge-access bindings
        run: |
          set -euo pipefail
          # The IAP service agent must hold invocation rights (else every
          # request 403s at invocation).
          gcloud run services add-iam-policy-binding "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --member="${IAP_SERVICE_AGENT}" \
            --role=roles/run.invoker
          # Platform-edge access: the PO account.
          gcloud iap web add-iam-policy-binding \
            --member="${IAP_PO_USER}" \
            --role=roles/iap.httpsResourceAccessor \
            --region="${GCP_REGION}" --resource-type=cloud-run --service="${SERVICE}"
          # Platform-edge access: the WIF deploy SA (smoke identity).
          gcloud iap web add-iam-policy-binding \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role=roles/iap.httpsResourceAccessor \
            --region="${GCP_REGION}" --resource-type=cloud-run --service="${SERVICE}"

      - name: Verify IAP is enforced and the edge is fail-closed
        run: |
          set -euo pipefail
          if ! gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            | grep -q 'Iap Enabled: true'; then
            echo "::error::IAP is not enabled on ${SERVICE} — refusing to smoke-test an unprotected service."
            exit 1
          fi
          if gcloud run services get-iam-policy "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(bindings)' | grep -q '"allUsers"'; then
            echo "::error::An allUsers binding exists on ${SERVICE} — IAP edge must stay fail-closed."
            exit 1
          fi
          # C1 (#396 — cyber sign-off condition, #317 comment 7059788814):
          # the allUsers check alone does not catch allAuthenticatedUsers.
          # The invoker member set must be EXACTLY the IAP service agent —
          # any other principal (a stray allAuthenticatedUsers above all)
          # would make the IAP edge bypassable (the app layer still answers
          # 401, but the zero-trust edge claim is void).
          gcloud run services get-iam-policy "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(bindings)' \
          | INVOKER_EXPECTED="${IAP_SERVICE_AGENT}" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          bindings = (raw.get("bindings", []) if isinstance(raw, dict) else raw)
          invoker = sorted(set(m for b in bindings if b.get("role") == "roles/run.invoker" for m in b.get("members", [])))
          expected = [os.environ["INVOKER_EXPECTED"]]
          if invoker != expected:
              print("::error::C1 violation: roles/run.invoker on " + os.environ["SERVICE"] + " must be held by exactly the IAP service agent — found members=" + json.dumps(invoker) + ", expected=" + json.dumps(expected) + " (allAuthenticatedUsers or any stray invoker would bypass the IAP edge; #317 C1).")
              sys.exit(1)
          print("C1 verified: roles/run.invoker held by exactly the IAP service agent.")
          '
          echo "IAP enforced; no allUsers/allAuthenticatedUsers binding; invoker = IAP service agent only."

      # First deploy only: the .run.app URL is knowable only once the service
      # exists — sync the origin-derived env vars onto the service (a second
      # revision). Steady-state deploys already carry the correct values in
      # the rendered YAML, so this step is skipped. TRUSTED_HOSTS rides along
      # (#396 C3, #406): the bootstrap render carries the '*.run.app' wildcard
      # fallback (the hash-bearing URL does not exist yet); the sync replaces
      # it with the exact two-host list (scraped primary + deterministic
      # project-number form) before the smoke checks and the C2/C3 read-back
      # gate run.
      - name: Sync origin-derived env vars (first deploy)
        if: steps.pre.outputs.url == ''
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)')"
          primary_host="${url#https://}"
          number_host="${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          gcloud run services update "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --update-env-vars="CORS_ORIGINS=[\"${url}\",\"https://${number_host}\"],AUTH_REDIRECT_URI=${url}/auth/callback,TRUSTED_HOSTS=[\"${primary_host}\",\"${number_host}\"]"

      # C2/C3 (#396 — cyber sign-off conditions, #317 comment 7059788814):
      # read the DEPLOYED coach-web container env back from the service
      # (post-sync, so first-deploy placeholder values are already replaced)
      # and fail the run on config drift:
      #   - AUTH_REDIRECT_URI must be present, https and on the service's own
      #     origin — auth/router.py falls back to request.base_url when the
      #     setting is empty, a path influenceable under FORWARDED_ALLOW_IPS=*
      #     (#317 C2; today the value is pinned — the gate keeps it pinned).
      #   - TRUSTED_HOSTS must be exactly the two served hostnames — the
      #     scraped primary hash form AND the deterministic project-number
      #     form (Cloud Run serves both URL families; #406 ruling comment
      #     7061551550). The shared '*.run.app' wildcard is permitted only
      #     for the bootstrap render before the service exists and never
      #     survives to this gate (#317 C3; verified live in #317 that a
      #     spoofed Host is dropped by the GFE, so this stays
      #     defence-in-depth).
      - name: Assert deployed config (AUTH_REDIRECT_URI, TRUSTED_HOSTS)
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)')"
          gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(spec.template.spec.containers)' \
          | SERVICE_URL="${url}" \
            NUMBER_HOST="${SERVICE}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app" \
            SNAPSHOT_BUCKET_EXPECTED="${SNAPSHOT_BUCKET}" \
            SNAPSHOT_OBJECT_EXPECTED="${SNAPSHOT_OBJECT}" python3 -c '
          import json, os, sys
          from urllib.parse import urlparse
          raw = json.load(sys.stdin)
          containers = (raw.get("spec", {}).get("template", {}).get("spec", {}).get("containers", []) if isinstance(raw, dict) else raw)
          env = {}
          for c in containers:
              if c.get("name") == "coach-web":
                  env = {e.get("name"): e.get("value", "") for e in c.get("env", [])}
          if not env:
              print("::error::C2/C3 gate could not read the coach-web container env from the deployed service spec.")
              sys.exit(1)
          origin = os.environ["SERVICE_URL"].rstrip("/")
          host = urlparse(origin).hostname
          number_host = os.environ["NUMBER_HOST"]
          redirect = env.get("AUTH_REDIRECT_URI", "")
          trusted = env.get("TRUSTED_HOSTS", "")
          failed = False
          redirect_ok = (urlparse(redirect).scheme == "https" and redirect == origin + "/auth/callback")
          if not redirect_ok:
              print("::error::C2 violation: deployed AUTH_REDIRECT_URI=" + json.dumps(redirect) + " must be a https URL on the service origin (" + origin + "/auth/callback) — an empty or drifted value lets auth/router.py fall back to request.base_url, influenceable under FORWARDED_ALLOW_IPS=* (#317 C2).")
              failed = True
          expected_hosts = [host, number_host]
          # Compact JSON separators — the rendered env value is bash-built
          # ("[a,b]") while default json.dumps would emit "[a, b]" (space
          # after the comma), a false drift the single-host form never
          # exposed (no separator in a one-element list).
          if trusted != json.dumps(expected_hosts, separators=(",", ":")):
              print("::error::C3 violation: deployed TRUSTED_HOSTS=" + json.dumps(trusted) + " must be exactly " + json.dumps(expected_hosts) + " — the shared *.run.app wildcard matches every Cloud Run service of every GCP project (#317 C3; permitted only for the bootstrap render before the service exists; both served URL forms enumerated per the #406 ruling).")
              failed = True
          # Durable snapshot store (MADR-0032, #417): the serving container
          # must carry the exact bucket/object/debounce wiring the deploy
          # rendered — a drifted value would silently disable durability or
          # point at the wrong bucket.
          expected_snapshot = {
              "COACH_SNAPSHOT_BUCKET": os.environ["SNAPSHOT_BUCKET_EXPECTED"],
              "COACH_SNAPSHOT_OBJECT": os.environ["SNAPSHOT_OBJECT_EXPECTED"],
              "COACH_SNAPSHOT_DEBOUNCE_SECONDS": "60",
          }
          deployed_snapshot = {key: env.get(key, "") for key in expected_snapshot}
          if deployed_snapshot != expected_snapshot:
              print("::error::MADR-0032 violation: deployed snapshot env drifted — found=" + json.dumps(deployed_snapshot, sort_keys=True) + ", expected=" + json.dumps(expected_snapshot, sort_keys=True) + " (a missing/misdirected bucket silently disables durable persistence; #417 C1/C5).")
              failed = True
          if failed:
              sys.exit(1)
          print("C2 verified: AUTH_REDIRECT_URI is https on the service origin. C3 verified: TRUSTED_HOSTS is the exact two-host served list (primary hash form + project-number form). MADR-0032 verified: snapshot bucket/object/debounce env is exactly as rendered.")
          '

      # D4 (MADR-0027 Amendment 0002, issue #390) — post-deploy drift guard:
      # read the DEPLOYED service spec back and fail the run on drift:
      #   - the serving serviceAccountName must be the dedicated runtime SA
      #     (Amendment 0001 identity split) — any other identity re-opens the
      #     Amendment 0001 finding (a deployer-controlled or foreign runtime
      #     identity);
      #   - the env secretKeyRef surface must be EXACTLY the rendered wiring
      #     (6 secrets, per-container): coach-web → OPENROUTER_API_KEY,
      #     GOOGLE_OIDC_CLIENT_SECRET, AUTH_SESSION_SECRET, DATA_ENCRYPTION_KEY;
      #     coach-mcp → INTERVALS_API_KEY; github-mcp → GITHUB_TOKEN exposed
      #     as GITHUB_PERSONAL_ACCESS_TOKEN — any rogue-revision edit of the
      #     wiring (the R1 escalation path, issue #390) fails the run.
      # The ruling's invoker-set assertion is subsumed by the #396 C1 gate
      # above (invoker set == exactly the IAP service agent — a strictly
      # stronger check) and is deliberately NOT duplicated here.
      - name: Assert deployed identity and secret wiring (D4 drift guard, Amendment 0002)
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(spec.template.spec)' \
          | EXPECTED_SA="${RUNTIME_SA}" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          spec = (raw.get("spec", {}).get("template", {}).get("spec", {}) if isinstance(raw, dict) else {})
          expected_sa = os.environ["EXPECTED_SA"]
          expected_wiring = {
              "coach-web": {
                  "OPENROUTER_API_KEY": "OPENROUTER_API_KEY",
                  "GOOGLE_OIDC_CLIENT_SECRET": "GOOGLE_OIDC_CLIENT_SECRET",
                  "AUTH_SESSION_SECRET": "AUTH_SESSION_SECRET",
                  "DATA_ENCRYPTION_KEY": "DATA_ENCRYPTION_KEY",
              },
              "coach-mcp": {"INTERVALS_API_KEY": "INTERVALS_API_KEY"},
              "github-mcp": {"GITHUB_PERSONAL_ACCESS_TOKEN": "GITHUB_TOKEN"},
          }
          failed = False
          sa = spec.get("serviceAccountName", "")
          if sa != expected_sa:
              print("::error::D4 violation: deployed serviceAccountName=" + json.dumps(sa) + " must be the dedicated runtime SA " + json.dumps(expected_sa) + " (Amendment 0001 identity split; a foreign runtime identity re-opens the deploy-SA escalation path — issue #390).")
              failed = True
          wiring = {}
          for c in spec.get("containers", []):
              refs = {}
              for e in c.get("env", []):
                  ref = (e.get("valueFrom") or {}).get("secretKeyRef")
                  if ref:
                      refs[e.get("name")] = ref.get("name")
              wiring[c.get("name")] = refs
          if wiring != expected_wiring:
              print("::error::D4 violation: deployed secretKeyRef wiring drifted — found=" + json.dumps(wiring, sort_keys=True) + ", expected=" + json.dumps(expected_wiring, sort_keys=True) + " (rogue-revision env/secret edits are the R1 escalation path; MADR-0027 Amendment 0002 D4).")
              failed = True
          if failed:
              sys.exit(1)
          print("D4 verified: serving identity is the runtime SA and the 6-secret per-container secretKeyRef wiring is unchanged.")
          '

      # C4 (#396 — cyber sign-off condition, #317 comment 7059788814):
      # the deployer holds roles/iam.serviceAccountUser (actAs) on the
      # runtime SA — required to set serviceAccountName, and harmless ONLY
      # while no principal can mint tokens for that identity: the moment a
      # token-minting grant appears on coach-web-runtime, actAs becomes a
      # direct read path to all 6 app secrets (#317 C4; the denial path was
      # demonstrated live in #317). Assert the runtime-SA policy grants NO
      # token-minting role (roles/iam.serviceAccountTokenCreator /
      # ...AccessTokenCreator / ...OpenIdTokenCreator) to ANY principal.
      # Explicit, justified exclusion (flagged for @cyber-security in the
      # #396 PR): the platform Cloud Run service agent
      # service-853194930683@serverless-robot-prod.iam.gserviceaccount.com —
      # Cloud Run's own runtime-identity mechanism. (Role-NAME matching per
      # the AC; custom roles with equivalent permissions are out of scope.)
      - name: Assert no token-minting grants on the runtime SA
        run: |
          set -euo pipefail
          gcloud iam service-accounts get-iam-policy "${RUNTIME_SA}" \
            --project="${GCP_PROJECT}" \
            --format='json(bindings)' \
          | PLATFORM_AGENT="serviceAccount:service-853194930683@serverless-robot-prod.iam.gserviceaccount.com" \
            RUNTIME_SA="${RUNTIME_SA}" python3 -c '
          import json, os, re, sys
          raw = json.load(sys.stdin)
          bindings = (raw.get("bindings", []) if isinstance(raw, dict) else raw)
          platform = os.environ["PLATFORM_AGENT"]
          minting = re.compile(r"iam\.serviceAccount(Token|AccessToken|OpenIdToken)Creator$")
          violations = []
          platform_only = False
          for b in bindings:
              role = b.get("role", "")
              if not minting.search(role):
                  continue
              members = b.get("members", [])
              if sorted(members) == [platform]:
                  platform_only = True
                  continue
              violations.extend(role + " -> " + m for m in members if m != platform)
          if violations:
              print("::error::C4 violation: token-minting grants exist on " + os.environ["RUNTIME_SA"] + " — the holder(s) can mint access/ID tokens for the runtime identity, turning the deployer actAs bridge into a direct read path to all 6 secrets: " + "; ".join(violations) + " (#317 C4; remove the grant(s), docs/admin_guide.md → Production deploy lane).")
              sys.exit(1)
          if platform_only:
              print("C4 note: a token-minting role is held ONLY by the platform Cloud Run service agent (explicitly excluded — Cloud Run runtime-identity mechanism; flagged for @cyber-security verification, #396).")
          print("C4 verified: no non-platform principal holds token-minting rights on " + os.environ["RUNTIME_SA"] + ".")
          '

      # AC3 (MADR-0027 Amendment 0002 D2, issue #390; extended per Amendment
      # 0005 / MADR-0031 C4, issue #427) — IAM-surface drift gate (BLOCKING —
      # the live migrations were executed: resource-scoped run.admin
      # 2026-11-21, resource-scoped iap.admin 2026-11-22): the deploy SA must
      # hold NO project-level roles/run.admin AND NO project-level
      # roles/iap.admin — both grants are resource-scoped on the coach-web
      # service only (run.admin: the service resource; iap.admin: the
      # coach-web IAP webServices resource — live evidence on #427, comment
      # 7078710086). Neither roles/run.admin nor roles/iap.admin includes
      # resourcemanager.projects.getIamPolicy, so the deploy SA cannot read
      # the project IAM policy to inspect its own bindings; the official
      # TestIamPermissions API (cloudresourcemanager v3) requires NO
      # permission to call and answers directly: a project-level run.admin
      # (re-)grant would surface run.services.getIamPolicy / update / delete
      # (all run.admin signature permissions) on the PROJECT resource, and a
      # project-level iap.admin (re-)grant would surface iap.web.setIamPolicy
      # and iap.projects.updateSettings (roles/iap.admin signature
      # permissions, https://docs.cloud.google.com/iam/docs/roles-permissions/iap),
      # while the resource-scoped bindings grant them only on their service
      # resources.
      # Steady state: an EMPTY result — Resource Manager v3 serializes it as
      # `{}` (the repeated `permissions` field is omitted when empty), so
      # exactly `{}` is accepted as the healthy steady state (issue #390
      # reopen, cyber verification comment 7060731941). Fail-closed: an API
      # error or any unexpected response also fails the run.
      - name: Assert no project-level run.admin or iap.admin on the deploy SA (AC3, Amendments 0002 + 0005)
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            -d '{"permissions":["run.services.getIamPolicy","run.services.update","run.services.delete","iap.web.setIamPolicy","iap.projects.updateSettings"]}' \
            "https://cloudresourcemanager.googleapis.com/v3/projects/${GCP_PROJECT}:testIamPermissions" \
          | python3 -c '
          import json, sys
          try:
              raw = json.load(sys.stdin)
          except Exception:
              print("::error::AC3 gate: TestIamPermissions returned a non-JSON response — failing closed (check API availability / auth).")
              sys.exit(1)
          # Minimal safe shape per cyber verification (comment 7060731941):
          # ONLY exactly `{}` is the healthy empty steady state (v3 omits the
          # repeated `permissions` field when empty); ONLY a dict whose sole
          # key is `permissions` with a list value is parsed. EVERY other
          # shape — API-error objects (key `error`), unexpected keys, non-dict
          # bodies, non-list `permissions` — fails closed.
          if raw == {}:
              held = []
          elif isinstance(raw, dict) and set(raw) == {"permissions"} and isinstance(raw["permissions"], list):
              held = raw["permissions"]
          else:
              print("::error::AC3 gate: unexpected TestIamPermissions response shape — failing closed: " + json.dumps(raw)[:300])
              sys.exit(1)
          if held:
              print("::error::AC3 violation: the deploy SA holds project-level run.* or iap.* admin-surface permissions " + json.dumps(held) + " on the project — the run.admin grant must be resource-scoped on the coach-web service ONLY (MADR-0027 Amendment 0002 D2) and the iap.admin grant resource-scoped on the coach-web IAP webServices resource ONLY (MADR-0027 Amendment 0005 / MADR-0031 C4); remove the project-level binding(s) per docs/admin_guide.md → Amendment 0002 / Amendment 0005 deltas.")
              sys.exit(1)
          print("AC3 verified: no project-level run.admin- or iap.admin-surface permission on the deploy SA (both grants resource-scoped on coach-web).")
          '

      # AC3 (grooming amendment #1) — IAP-aware smoke, no PO browser needed:
      #   1. unauthenticated GET / → IAP edge: 302 (Google sign-in redirect)
      #      or 403; the app is never reached. 200 would mean IAP is not
      #      enforced → hard fail.
      #   2. authorized smoke as the deploy SA (iap.httpsResourceAccessor)
      #      with NO app session cookie: /health → 200 (the probe surface;
      #      /healthz is NOT checked — Cloud Run reserves URL paths ending
      #      in `z` and the GFE intercepts /healthz with an edge 404,
      #      cloud.google.com/run/docs/known-issues);
      #      /api/* → 401 (app-layer boundary; full matrix in #317).
      # The ID-token audience is the IAP OAuth client ID, scraped from the
      # IAP sign-in redirect (fallback: project IAP settings) and asserted
      # equal to the GOOGLE_OIDC_CLIENT_ID Actions variable — a mismatch is
      # IAP settings drift (the same OAuth client must be both the IAP custom
      # client and the app OIDC client). The token is minted by a DIRECT IAM
      # Credentials API call (generateIdToken): a keyless WIF session holds
      # external-account credentials, which `print-identity-token --audiences`
      # rejects ("Invalid account type for --audiences" — deploy attempt #5),
      # and gcloud's --impersonate-service-account shortcut first drives
      # generateAccessToken — PERMISSION_DENIED under the deployer's narrowed
      # self-grant (deploy attempt #7, cyber C1). generateIdToken needs
      # exactly getOpenIdToken: the deployer's self
      # roles/iam.serviceAccountOpenIdTokenCreator (Amendment 0001 delta 6).
      - name: IAP-aware smoke checks
        env:
          GOOGLE_OIDC_CLIENT_ID: ${{ vars.GOOGLE_OIDC_CLIENT_ID }}
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)')"

          unauth_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${url}/")"
          echo "unauthenticated GET / -> HTTP ${unauth_code}"
          if [ "${unauth_code}" != "302" ] && [ "${unauth_code}" != "403" ]; then
            echo "::error::Unauthenticated GET / returned HTTP ${unauth_code} — expected IAP 302/403 at the edge. HTTP 200 would mean IAP is not enforced."
            exit 1
          fi

          redirect="$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 30 "${url}/" || true)"
          client_id="$(printf '%s' "${redirect}" | sed -n 's/.*[?&]client_id=\([^&]*\).*/\1/p' || true)"
          if [ -z "${client_id}" ]; then
            client_id="$(gcloud iap settings get --project="${GCP_PROJECT}" 2>/dev/null \
              | sed -n 's/^.*client_id: *//p' | head -n1 || true)"
          fi
          if [ -z "${client_id}" ]; then
            echo "::error::Could not determine the IAP OAuth client ID (smoke ID-token audience). Check the project-level IAP settings (docs/admin_guide.md → IAP prerequisites)."
            exit 1
          fi

          # Drift guard — BEFORE minting: the scraped client_id must equal the
          # Actions variable (same OAuth client is both the IAP custom client
          # and the app OIDC client; the deployed revision env proves it).
          if [ "${client_id}" != "${GOOGLE_OIDC_CLIENT_ID}" ]; then
            echo "::error::IAP settings drift: the client_id in the IAP sign-in redirect (${client_id}) does not equal the GOOGLE_OIDC_CLIENT_ID Actions variable (${GOOGLE_OIDC_CLIENT_ID}). Re-apply the IAP custom client (docs/admin_guide.md → IAP prerequisites)."
            exit 1
          fi
          echo "IAP OAuth client ID resolved from the sign-in redirect and verified against GOOGLE_OIDC_CLIENT_ID."

          # Direct IAM Credentials API mint — the WIF session's external-account
          # credentials cannot use `--audiences` (requires classic SA-key
          # credentials), and gcloud's SA-impersonation shortcut first drives
          # generateAccessToken (the broader tokenCreator role, deliberately
          # not granted — cyber C1). generateIdToken needs exactly the narrow
          # getOpenIdToken permission: the deployer's self
          # roles/iam.serviceAccountOpenIdTokenCreator grant (delta 6).
          token="$(curl -sS -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${DEPLOY_SA}:generateIdToken" \
            -d "{\"audience\": \"${GOOGLE_OIDC_CLIENT_ID}\", \"includeEmail\": true}" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin).get("token", ""))')"
          echo "::add-mask::${token}"
          if [ -z "${token}" ]; then
            echo "::error::Failed to mint the deploy-SA ID token via the IAM Credentials API — check the deployer's self roles/iam.serviceAccountOpenIdTokenCreator grant (docs/admin_guide.md → Amendment 0001 delta 6)."
            exit 1
          fi

          # IAM/IAP grants propagate asynchronously — retry briefly.
          # No /healthz check: Cloud Run reserves URL paths ending in `z` —
          # the GFE answers exact /healthz with an edge 404 before the
          # container is reached (cloud.google.com/run/docs/known-issues).
          health_code="000"; api_code="000"
          for attempt in 1 2 3 4 5 6; do
            health_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer ${token}" "${url}/health")"
            api_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer ${token}" "${url}/api/agent/stream")"
            echo "attempt ${attempt}: /health=${health_code} /api/agent/stream=${api_code}"
            if [ "${health_code}" = "200" ] && [ "${api_code}" = "401" ]; then
              break
            fi
            sleep 10
          done

          failed=0
          if [ "${health_code}" != "200" ]; then
            echo "::error::Authorized /health expected 200, got ${health_code} (deploy SA carries iap.httpsResourceAccessor; check IAP propagation and app boot logs)."
            failed=1
          fi
          if [ "${api_code}" != "401" ]; then
            echo "::error::Authorized /api/agent/stream without an app session expected 401, got ${api_code}."
            failed=1
          fi
          if [ "${failed}" -ne 0 ]; then exit 1; fi
          {
            echo "SMOKE_URL=${url}"
            echo "SMOKE_UNAUTH=${unauth_code}"
            echo "SMOKE_HEALTH=${health_code}"
            echo "SMOKE_API=${api_code}"
          } >> "$GITHUB_ENV"

      # -------------------------------------------------------------------
      # Public static landing surface (MADR-0031, #427). The landing service
      # is PRIVATE at rest (invoker set below) and public only after the C3
      # gate asserts the exact posture. Zero env entries, zero secrets, no
      # IAP annotation, no console path space.
      # -------------------------------------------------------------------

      # Bootstrap boundary (MADR-0027 Am. 0002): run.services.create is only
      # grantable at project level and the deploy SA holds NO project-level
      # run.admin — the one-time creation of the (private) landing service is
      # a documented PO/bootstrap step (docs/admin_guide.md → MADR-0031
      # bootstrap), followed by the resource-scoped roles/run.admin grant for
      # the deployer ON the landing service. The lane deploys (replaces) an
      # existing service and fails closed with the recovery instructions.
      - name: Refuse to bootstrap the landing service from the lane
        run: |
          set -euo pipefail
          if ! gcloud run services describe "${LANDING_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" >/dev/null 2>&1; then
            echo "::error::${LANDING_SERVICE} does not exist — run.services.create is project-level and the deploy SA holds NO project-level run.admin (MADR-0027 Am. 0002). Execute the one-time PRIVATE bootstrap in docs/admin_guide.md → MADR-0031 bootstrap (gcloud run deploy coach-web-landing --image=<digest-pinned-landing-image> --no-allow-unauthenticated, then the resource-scoped roles/run.admin grant for the deployer), then re-run this workflow."
            exit 1
          fi
          echo "${LANDING_SERVICE} exists (bootstrap boundary respected)."

      - name: Render the landing service YAML
        env:
          LANDING_REF: ${{ steps.resolve-landing.outputs.ref }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/landing-service.yaml" <<YAML
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: ${LANDING_SERVICE}
            labels:
              cloud.googleapis.com/location: ${GCP_REGION}
            annotations:
              run.googleapis.com/ingress: all
              run.googleapis.com/description: Coach Web public static landing surface (MADR-0031, #427)
          spec:
            template:
              metadata:
                annotations:
                  autoscaling.knative.dev/minScale: '0'
                  autoscaling.knative.dev/maxScale: '2'
              spec:
                timeoutSeconds: 10
                serviceAccountName: ${LANDING_SA}
                containers:
                - name: landing
                  image: ${LANDING_REF}
                  ports:
                  - name: http1
                    containerPort: 8080
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 128Mi
          YAML
          echo "Landing service YAML rendered at ${RUNNER_TEMP}/landing-service.yaml"

      # Cost-DoS bound (MADR-0031 C5): scale-to-zero (min=0), maxInstances=2,
      # a 10 s request timeout and a 128Mi/1000m container. NO env entries,
      # NO secretKeyRef, NO IAP annotation — the read-only immutable
      # distroless image needs no writable rootfs, and Cloud Run has no
      # readOnlyRootFilesystem container field to set.
      - name: Deploy the landing service (create or replace)
        run: |
          gcloud run services replace "${RUNNER_TEMP}/landing-service.yaml" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}"

      # MADR-0031 C3: --allow-unauthenticated semantics = allUsers +
      # roles/run.invoker (https://docs.cloud.google.com/run/docs/authenticating/public).
      # Idempotent — the exact member set is asserted fail-closed below.
      - name: Set the public invoker on the landing service
        run: |
          gcloud run services add-iam-policy-binding "${LANDING_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --member="allUsers" \
            --role=roles/run.invoker

      # MADR-0031 C3: per-service invoker & IAP posture, fail-closed:
      #   - NO iap-enabled annotation on the landing service (any value).
      #   - The landing service policy is EXACTLY two bindings:
      #       roles/run.invoker -> allUsers   (the public surface)
      #       roles/run.admin   -> deployer   (resource-scoped deploy grant,
      #                                        MADR-0027 Am. 0002 pattern)
      #     any other member or role — allAuthenticatedUsers, any iap.* role,
      #     any stray invoker — fails the run. (The console invoker == {IAP
      #     service agent} gate above is NOT weakened — it keeps asserting
      #     coach-web only.)
      - name: Assert landing surface public posture (MADR-0031 C3)
        run: |
          set -euo pipefail
          gcloud run services describe "${LANDING_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(metadata.annotations)' \
          | python3 -c '
          import json, sys
          raw = json.load(sys.stdin)
          annotations = (raw.get("metadata", {}).get("annotations", {}) if isinstance(raw, dict) else {})
          iap_value = annotations.get("run.googleapis.com/iap-enabled")
          if iap_value is not None:
              print("::error::C3 violation: coach-web-landing carries run.googleapis.com/iap-enabled=" + json.dumps(iap_value) + " — the public landing surface must carry NO IAP annotation (MADR-0031 C3); the console keeps IAP bit-for-bit unchanged.")
              sys.exit(1)
          print("C3 verified: no iap-enabled annotation on coach-web-landing.")
          '
          gcloud run services get-iam-policy "${LANDING_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(bindings)' \
          | DEPLOY_MEMBER="serviceAccount:${DEPLOY_SA}" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          bindings = (raw.get("bindings", []) if isinstance(raw, dict) else raw)
          deployer = os.environ["DEPLOY_MEMBER"]
          expected = {
              "roles/run.invoker": ["allUsers"],
              "roles/run.admin": [deployer],
          }
          found = {}
          violations = []
          for binding in bindings:
              role = binding.get("role", "")
              members = sorted(set(binding.get("members", [])))
              if role in expected:
                  found.setdefault(role, []).extend(members)
              else:
                  violations.append(role + " -> " + ",".join(members))
          for public in ("allUsers", "allAuthenticatedUsers"):
              if any(public in (b.get("members") or []) for b in bindings if b.get("role") != "roles/run.invoker"):
                  violations.append("public principal outside the invoker set: " + public)
          normalized = {role: sorted(set(members)) for role, members in found.items()}
          if normalized != expected or violations:
              print("::error::C3 violation: the landing service IAM must be EXACTLY " + json.dumps(expected, sort_keys=True) + " — found=" + json.dumps(normalized, sort_keys=True) + "; " + "; ".join(violations) + " (any extra member or role, incl. allAuthenticatedUsers or any iap.* role, fails closed; MADR-0031 C3).")
              sys.exit(1)
          print("C3 verified: landing invoker is exactly allUsers and the policy carries only the resource-scoped deployer run.admin.")
          '

      # MADR-0031 C5/C6: the deployed landing spec must match the rendered
      # hardening posture exactly — dedicated zero-role SA, digest-pinned
      # image, zero env / zero secretKeyRef / zero
      # GOOGLE_APPLICATION_CREDENTIALS, bounded scale, timeout and resources.
      - name: Assert deployed landing spec (MADR-0031 C5/C6)
        run: |
          set -euo pipefail
          gcloud run services describe "${LANDING_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='json(spec.template)' \
          | EXPECTED_SA="${LANDING_SA}" \
            EXPECTED_IMAGE_PREFIX="ghcr.io/fpittelo/coach-web-landing@sha256:" python3 -c '
          import json, os, sys
          raw = json.load(sys.stdin)
          template = (raw.get("spec", {}).get("template", {}) if isinstance(raw, dict) else {})
          spec = template.get("spec", {})
          annotations = (template.get("metadata", {}) or {}).get("annotations", {})
          expected_sa = os.environ["EXPECTED_SA"]
          image_prefix = os.environ["EXPECTED_IMAGE_PREFIX"]
          failed = False
          containers = spec.get("containers", [])
          if len(containers) != 1 or containers[0].get("name") != "landing":
              print("::error::C5 violation: the landing service must carry exactly one container named landing — found=" + json.dumps([c.get("name") for c in containers]) + ".")
              failed = True
          for container in containers:
              image = container.get("image", "")
              if not image.startswith(image_prefix):
                  print("::error::C6 violation: the landing image must be digest-pinned on ghcr.io/fpittelo/coach-web-landing@sha256:… — found=" + json.dumps(image) + " (MADR-0031 C6; the #411 drift guard applies to the public surface too).")
                  failed = True
              env_entries = container.get("env") or []
              if env_entries:
                  print("::error::C5 violation: the landing container must carry ZERO env entries — found=" + json.dumps([e.get("name") for e in env_entries]) + " (no config, no secrets; MADR-0031 C5).")
                  failed = True
              if container.get("resources", {}).get("limits") != {"cpu": "1000m", "memory": "128Mi"}:
                  print("::error::C5 violation: the landing container limits must be exactly cpu=1000m memory=128Mi — found=" + json.dumps(container.get("resources", {}).get("limits")) + " (cost-DoS bound; MADR-0031 C5).")
                  failed = True
          sa = spec.get("serviceAccountName", "")
          if sa != expected_sa:
              print("::error::C5 violation: deployed serviceAccountName=" + json.dumps(sa) + " must be the dedicated zero-role landing SA " + json.dumps(expected_sa) + " (MADR-0031 C1/C5; the default compute SA may carry a broad inherited role).")
              failed = True
          if spec.get("timeoutSeconds") != 10:
              print("::error::C5 violation: deployed timeoutSeconds=" + json.dumps(spec.get("timeoutSeconds")) + " must be 10 (cost-DoS bound; MADR-0031 C5).")
              failed = True
          if annotations.get("autoscaling.knative.dev/minScale") != "0" or annotations.get("autoscaling.knative.dev/maxScale") != "2":
              print("::error::C5 violation: deployed scale bounds must be minScale=0 maxScale=2 — found=" + json.dumps(annotations) + " (scale-to-zero with a bounded public burst; MADR-0031 C5).")
              failed = True
          blob = json.dumps(raw)
          if "secretKeyRef" in blob or "GOOGLE_APPLICATION_CREDENTIALS" in blob:
              print("::error::C5 violation: the landing service spec references secretKeyRef or GOOGLE_APPLICATION_CREDENTIALS — a Cloud Run service must never carry GOOGLE_APPLICATION_CREDENTIALS and the public surface must carry zero secret wiring (https://docs.cloud.google.com/run/docs/configuring/service-accounts; MADR-0031 C5).")
              failed = True
          if failed:
              sys.exit(1)
          print("C5/C6 verified: dedicated zero-role SA, digest-pinned image, zero env/secret wiring, bounded scale/timeout/resources.")
          '

      # MADR-0031 C7: content provenance of the PUBLIC surface, probed
      # unauthenticated (a public endpoint is a phishing magnet if its content
      # can be swapped): the page must answer 200 with the pinned caching and
      # security headers, ZERO Set-Cookie / accounts.google.com / x-goog-iap
      # surface, the EXACT canonical CTA constant, and zero console path
      # space (404s).
      - name: Probe the public landing surface (MADR-0031 C7)
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${LANDING_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.address.url)')"
          echo "Probing unauthenticated ${url}/ (zero Google interaction)"
          headers="$(mktemp)"; body="$(mktemp)"
          code="$(curl -sS -o "${body}" -D "${headers}" -w '%{http_code}' --max-time 30 "${url}/")"
          if [ "${code}" != "200" ]; then
            echo "::error::Unauthenticated GET ${url}/ returned HTTP ${code} — expected 200 from the public landing surface (AC1)."
            exit 1
          fi
          if ! grep -qi '^cache-control: public, max-age=300' "${headers}"; then
            echo "::error::C5 violation: the landing response is missing Cache-Control: public, max-age=300 (see ${headers})."
            cat "${headers}"
            exit 1
          fi
          if grep -qi '^set-cookie:' "${headers}"; then
            echo "::error::C5 violation: the landing response carries a Set-Cookie header — the public surface must be cookie-free (MADR-0031 C5/C7)."
            exit 1
          fi
          if grep -qi 'accounts\.google\.com\|x-goog-iap' "${headers}" "${body}"; then
            echo "::error::C3 violation: the landing response surfaces accounts.google.com or x-goog-iap — the visitor must see ZERO Google interaction (AC1; MADR-0031 C7)."
            exit 1
          fi
          if ! grep -Fq "href=\"${LANDING_CONSOLE_CTA}\"" "${body}"; then
            echo "::error::C7 violation: the served landing HTML lacks the canonical CTA href=\"${LANDING_CONSOLE_CTA}\" — content drift or a broken rewrite (MADR-0031 C7; compare the served sha256 against the build log)."
            exit 1
          fi
          cta_probe="$(grep -F "href=\"${LANDING_CONSOLE_CTA}\"" "${body}" | head -n1)"
          echo "CTA verified: ${cta_probe}"
          echo "LANDING_URL=${url}" >> "$GITHUB_ENV"
          echo "LANDING_ROOT=${code}" >> "$GITHUB_ENV"
          for path in /auth/login /api/health /health; do
            path_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${url}${path}")"
            echo "LANDING_${path//[\/]/_}=${path_code}" >> "$GITHUB_ENV"
            if [ "${path_code}" != "404" ]; then
              echo "::error::C7 violation: GET ${url}${path} returned HTTP ${path_code} — the landing surface must serve NOTHING outside / and /static/landing.css (no console path space; MADR-0031 C5/C7)."
              exit 1
            fi
          done
          echo "Content provenance verified: 200 + pinned headers + canonical CTA + zero console path space."

      - name: Write job summary
        env:
          PREV_REVISION: ${{ steps.pre.outputs.prev_revision }}
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "${SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.latestReadyRevisionName)')"
          {
            echo "## Cloud Run production deploy — ${SERVICE}"
            echo ""
            echo "| Item | Value |"
            echo "|:---|:---|"
            echo "| Service URL | ${SMOKE_URL} |"
            echo "| coach-web image | ${{ steps.resolve.outputs.ref }} |"
            echo "| coach-mcp image | ${{ steps.sidecars.outputs.coach_mcp_ref }} |"
            echo "| github-mcp image | ${{ steps.sidecars.outputs.github_mcp_ref }} |"
            echo "| Landing URL | ${LANDING_URL} |"
            echo "| coach-web-landing image | ${{ steps.resolve-landing.outputs.ref }} |"
            echo "| Serving revision | ${revision} |"
            echo "| Region / project | ${GCP_REGION} / ${GCP_PROJECT} |"
            echo ""
            echo "### IAP-aware smoke matrix (AC3)"
            echo ""
            echo "| Check | Expected | Observed |"
            echo "|:---|:---|:---|"
            echo "| Unauthenticated \`GET /\` | 302/403 (IAP edge) | ${SMOKE_UNAUTH} |"
            echo "| Authorized \`GET /health\` (SA ID token, no app session) | 200 | ${SMOKE_HEALTH} |"
            echo "| Authorized \`GET /api/agent/stream\` (no app session) | 401 | ${SMOKE_API} |"
            echo ""
            echo "### Public landing surface probe matrix (MADR-0031 C3/C7, AC1/AC2)"
            echo ""
            echo "| Check | Expected | Observed |"
            echo "|:---|:---|:---|"
            echo "| Unauthenticated \`GET ${LANDING_URL}/\` | 200 + headers + canonical CTA | ${LANDING_ROOT} |"
            echo "| Unauthenticated \`GET /auth/login\` | 404 | ${LANDING__auth_login} |"
            echo "| Unauthenticated \`GET /api/health\` | 404 | ${LANDING__api_health} |"
            echo "| Unauthenticated \`GET /health\` | 404 | ${LANDING__health} |"
            if [ -n "${PREV_REVISION}" ]; then
              echo ""
              echo "### Rollback (runbook, docs/admin_guide.md)"
              echo ""
              echo '```bash'
              echo "gcloud run services update-traffic ${SERVICE} --region=${GCP_REGION} --to-revisions=${PREV_REVISION}=100"
              echo '```'
            else
              echo ""
              echo "First deploy — no previous revision to roll back to."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Grooming amendment #3: a fail-closed boot (e.g. AUTH_SESSION_SECRET
      # shorter than 32 bytes) must be visible in the startup-probe failure
      # logs — surface recent revision logs on any failure.
      - name: Dump recent revision logs on failure
        if: failure()
        run: |
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE}\"" \
            --project="${GCP_PROJECT}" --limit=40 \
            --format='value(timestamp, textPayload)' || true
