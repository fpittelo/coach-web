name: Deploy Coach Web Image

# ---------------------------------------------------------------------------
# Trigger → image tag mapping (issue #90, trunk+tag MADR-0017):
#   dev images                 → push to main (the trunk)
#   qa images                  → workflow_dispatch (environment=qa) on main:
#                                staging validation of the release candidate
#                                before tagging (deploy promotion replaces
#                                branch promotion, MADR-0017 §5)
#   prod/latest/vX.Y.Z images  → push of v* tag
# No branch-promotion triggers remain — dev/qa are retired.
#
# After build/push, the workflow verifies that the sidecar images each lane
# runs with (the coach-mcp lane tag and the pinned github-mcp release)
# resolve in GHCR before the lane image is declared good (issue #110).
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev, qa, prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push OCI Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine environment tag
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV_TAG="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            ENV_TAG="${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            ENV_TAG="dev"
          else
            ENV_TAG="latest"
          fi
          # Lane mapping (issue #90, trunk+tag MADR-0017): a push to main is
          # the dev lane; the qa lane is a manual workflow_dispatch on main
          # (staging validation of the release candidate before tagging);
          # prod is the manual-dispatch choice and v* tag pushes. deploy_env
          # also selects the coach-mcp sidecar lane tag verified at the end
          # of this job.
          case "${ENV_TAG}" in
            dev)             DEPLOY_ENV="dev" ;;
            qa)              DEPLOY_ENV="qa" ;;
            latest|prod|v*)  DEPLOY_ENV="prod" ;;
            *)               DEPLOY_ENV="prod" ;;
          esac
          # Version derivation (#198): a v* tag push reports the release
          # version (leading v stripped); every other build reports a
          # traceable non-release version "<lane>-<short-sha>". No manual
          # pyproject bump participates — the git ref is the single source.
          if [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${ENV_TAG}-${GITHUB_SHA::7}"
          fi
          echo "tag=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate OCI image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.env.outputs.tag }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ steps.env.outputs.tag == 'prod' || startsWith(steps.env.outputs.tag, 'v') }}
            type=raw,value=prod,enable=${{ startsWith(steps.env.outputs.tag, 'v') }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push OCI Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build-time version derivation (#198): the image reports the git
          # ref it was built from on /healthz (release tag, or
          # "<lane>-<short-sha>" for dev/qa lane builds).
          build-args: |
            COACH_WEB_VERSION=${{ steps.env.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed images
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            echo "Verifying registry presence of ${image}"
            docker buildx imagetools inspect "${image}" > /dev/null
          done <<< "${TAGS}"

      # ---------------------------------------------------------------------
      # Sidecar lane verification (issue #110): before a lane image is
      # declared good, prove the companion images it runs with actually
      # resolve in GHCR — the coach repo publishes matching dev/qa/prod
      # lane tags, and github-mcp is the pinned upstream release (digest-pinned
      # on the prod lane, AC7 / #113). Verification only: no outputs exported.
      # ---------------------------------------------------------------------
      - name: Verify sidecar lane images resolve
        env:
          COACH_MCP_REF: ghcr.io/fpittelo/coach:${{ steps.env.outputs.deploy_env }}
          GITHUB_MCP_REF: ghcr.io/github/github-mcp-server:v1.12.2@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6
        run: |
          set -euo pipefail

          resolve_digest() {
            local ref="$1" digest
            digest="$(docker buildx imagetools inspect "${ref}" | sed -n 's/^Digest:[[:space:]]*//p')"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Failed to resolve a valid digest for ${ref} (got: '${digest}'). Check that the image/tag exists and that this repository has read access to the GHCR package."
              exit 1
            fi
            echo "${digest}"
          }

          coach_mcp_digest="$(resolve_digest "${COACH_MCP_REF}")"
          github_mcp_digest="$(resolve_digest "${GITHUB_MCP_REF}")"
          echo "coach-mcp lane image resolves: ${COACH_MCP_REF} @ ${coach_mcp_digest}"
          echo "github-mcp image resolves: ${GITHUB_MCP_REF} @ ${github_mcp_digest}"
