name: CI Test & Lint

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Black Formatting
        run: black --check .

      - name: Check Import Order (isort)
        run: isort --check-only .

      - name: Run Mypy Type Checker
        run: mypy --strict src/coach_web tests

      - name: Run Pytest Test Suite
        run: pytest -v -W error --cov=src/coach_web --cov-report=term-missing --cov-fail-under=80 tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build OCI Docker Image (Validation)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: coach-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Vulnerability Scanning (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict .
