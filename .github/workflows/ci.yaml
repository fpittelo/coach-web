name: CI Test & Lint

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Black Formatting
        run: black --check .

      - name: Check Import Order (isort)
        run: isort --check-only .

      - name: Run Mypy Type Checker
        run: mypy --strict src/coach_web tests

      - name: Run Pytest Test Suite
        run: pytest -v -W error --cov=src/coach_web --cov-report=term-missing --cov-fail-under=80 tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build OCI Docker Image (Validation)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: coach-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Vulnerability Scanning (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict .

  opentofu:
    name: OpenTofu Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up OpenTofu
        # SHA-pinned to opentofu/setup-opentofu@v2.0.2 (carried review item #3
        # from #64, executed in #67). The previously used @v1 major tag is
        # stale — v2 is the current major.
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"

      - name: OpenTofu Format Check (infra, recursive)
        run: tofu fmt -check -recursive infra/

      - name: OpenTofu Init (infra, no backend — this validate job holds no GCP
          credentials; the keyless WIF deploy path lives in deploy.yaml, #67)
        working-directory: infra
        run: tofu init -backend=false

      - name: OpenTofu Validate (infra)
        working-directory: infra
        run: tofu validate

      - name: OpenTofu Init (bootstrap, no backend — local backend by design)
        working-directory: infra/bootstrap
        run: tofu init -backend=false

      - name: OpenTofu Validate (bootstrap)
        working-directory: infra/bootstrap
        run: tofu validate
