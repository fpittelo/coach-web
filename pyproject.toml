[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coach-web"
# Static version pinned to the honest "unknown" sentinel (#198): the version
# reported by /healthz is derived at image build time from the git ref
# (COACH_WEB_VERSION build-arg -> resolve_version()), so a release-looking
# static value here would only ever go stale again. Keep 0.0.0.
version = "0.0.0"
description = "FastAPI web application for interactive Intervals.icu endurance coaching, agent pipeline & weekly training plan visualization"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
    { name = "Frederic Pitteloud", email = "fpittelo@users.noreply.github.com" },
]
dependencies = [
    "fastapi>=0.115.0",
    # anyio 4.15 deprecates the anyio.abc.BlockingPortal alias still referenced by
    # starlette 1.6.0, which breaks the `pytest -W error` zero-warning gate at import time.
    "anyio>=4.0,<4.15",
    "uvicorn[standard]>=0.32.0",
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
    # Google OIDC auth (#65): RS256 ID-token verification via Google JWKS and
    # HS256 stateless session tokens. Already resolved transitively via mcp.
    "pyjwt[crypto]>=2.8.0",
    # C2 health-data field encryption (MADR-0008 X3 + security condition C6,
    # #189): Fernet for the debrief notes at rest. Declared DIRECTLY per C6 —
    # transitive resolution via pyjwt[crypto] is fragile; the floor matches
    # the resolved major (uv.lock pins the exact version).
    "cryptography>=44.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1.0",
    # Internal persistence (MADR-008, #166): SQLite (WAL) via SQLAlchemy 2.0
    # async engine (aiosqlite driver) + Alembic migrations (render_as_batch).
    # The [asyncio] extra pulls greenlet, required by sqlalchemy.ext.asyncio.
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pyyaml>=6.0",
]

[project.scripts]
coach-web = "coach_web.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# The async engine's connect-event listener (db.py) executes inside
# SQLAlchemy's greenlet bridge (await → greenlet switch to sync pool code);
# without greenlet support coverage cannot trace it. "thread" must stay
# listed alongside: aiosqlite executes SQL on background threads, and naming
# any concurrency switches off coverage's default thread tracing.
concurrency = ["thread", "greenlet"]
# Coverage measures the shipped package only (#302). The CI gate scopes to
# `--cov=src/coach_web`; the shared harness gate runs the repo-agnostic
# `--cov=.`, which also swept in the test suite itself (~11k near-fully-covered
# statements) and scripts/, inflating the total to 99.47% vs CI's 98.64% on the
# same tree. Omitting non-shipped paths makes both invocations report the
# identical figure and keeps the >=80% gate measuring production code.
omit = ["tests/*", "scripts/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/coach_web/config.py" = ["S104"]
"tests/integration/test_compose_topology.py" = ["S104", "S108", "S404", "S603"]
"tests/integration/test_harness_native_gate.py" = ["S603"]
"tests/integration/test_lane_script.py" = ["S603"]
"tests/integration/test_preflight_loopback.py" = ["S104", "S603"]
"tests/integration/test_preflight_env_permissions.py" = ["S603"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false