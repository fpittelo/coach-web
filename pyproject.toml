[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coach-web"
version = "0.1.0"
description = "Streamlit web app for interactive Intervals.icu endurance coaching dashboard & weekly training plan visualization"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
    { name = "Frederic Pitteloud", email = "fpittelo@users.noreply.github.com" },
]
dependencies = [
    "streamlit>=1.39.0",
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]

[project.scripts]
coach-web = "coach_web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/coach_web/config.py" = ["S104"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
