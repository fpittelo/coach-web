# Coach Web — qa lane override (ADR-007 / issue #109).
#
# Staging validation lane: coach-web PULLS the CI-built, zero-warning-gated
# ghcr.io/fpittelo/coach-web:qa image (a local build would bypass the CI
# verification chain) and publishes on 127.0.0.1:8200 only. Auth is disabled.
# Runs concurrently with the dev/prod lanes (project coach-web-qa).
#
# Precondition: the :qa images exist only after the first post-change
# qa-lane build (coach-web:qa here, coach:qa in the coach repo).
#
# Usage:
#   cp .env.qa.example .env.qa      # then fill in your secrets
#   docker compose -p coach-web-qa -f compose.yaml -f compose.qa.yml \
#       --env-file .env.qa pull
#   ./scripts/e2e-preflight.sh qa   # validates, then tears its lane down on exit
#   docker compose -p coach-web-qa -f compose.yaml -f compose.qa.yml \
#       --env-file .env.qa up -d    # FINAL step — lane left serving

name: coach-web-qa

services:
  coach-web:
    image: ghcr.io/fpittelo/coach-web:qa
    ports:
      - "127.0.0.1:8200:8000"
    environment:
      # Loopback binding is the primary access control (ADR-007); the OIDC
      # whitelist is defense-in-depth and stays off on the qa lane.
      AUTH_ENABLED: "false"
      # Per-lane CORS default (folded finding from PR #116 review, #112).
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:8200"]}'

  coach-mcp:
    # Digest-pinned (#275): the :qa tag floats upstream (fpittelo/coach), so a
    # silent push would change the topology coach-web is tested against. The CI
    # drift check (scripts/check_sidecar_drift.sh) fails when :qa moves; update
    # the pin deliberately (docs/admin_guide.md, "Sidecar Image Pinning").
    image: ${COACH_MCP_IMAGE:-ghcr.io/fpittelo/coach@sha256:49579bfcfb705bba916e80bf99b9142ebe3e2b2bdb3b636751d9401e20404e0a}

  github-mcp:
    image: ${GITHUB_MCP_IMAGE:-ghcr.io/github/github-mcp-server:v1.12.2}
