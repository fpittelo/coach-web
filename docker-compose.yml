# Unified Docker Compose sidecar topology for local VIDAR execution.
#
# Orchestrates coach-web, coach-mcp and github-mcp on an isolated internal
# bridge network (coach-net) with service discovery via Docker DNS names.
# All containers run as non-root users with hardened runtime options.
#
# Usage:
#   cp .env.example .env
#   # edit .env with your secrets
#   docker compose up -d
#   ./scripts/e2e-preflight.sh

services:
  coach-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/fpittelo/coach-web:dev
    container_name: coach-web
    hostname: coach-web
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      COACH_MCP_URL: http://coach-mcp:8000/sse
      GITHUB_MCP_URL: http://github-mcp:8001/
    depends_on:
      coach-mcp:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
    networks:
      - coach-net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  coach-mcp:
    image: ${COACH_MCP_IMAGE:-ghcr.io/fpittelo/coach:dev}
    container_name: coach-mcp
    hostname: coach-mcp
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    networks:
      - coach-net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/sse', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  github-mcp:
    image: ${GITHUB_MCP_IMAGE:-ghcr.io/github/github-mcp-server:latest}
    container_name: github-mcp
    hostname: github-mcp
    command: ["http", "--port", "8001", "--listen-host", "0.0.0.0"]
    env_file:
      - .env
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOOLSETS: ${GITHUB_TOOLSETS:-default}
    networks:
      - coach-net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "/server/github-mcp-server", "--version"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

networks:
  coach-net:
    driver: bridge
    name: coach-net
