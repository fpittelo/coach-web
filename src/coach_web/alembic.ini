# Alembic configuration for Coach Web (MADR-008, issue #166).
#
# Packaged INSIDE coach_web so the runtime image always ships migrations
# matching the installed code version. script_location resolves relative to
# this file via %(here)s. The database URL is intentionally NOT pinned here:
# alembic/env.py derives it from COACH_DB_PATH (container default
# /data/coach.db) so every lane and the test suite target their own file.
#
# Logging is intentionally NOT configured (no [loggers] section): the
# migration entrypoint runs before uvicorn boots, and the pytest suite
# invokes migrations in-process where a fileConfig would clobber pytest's
# log capture. A failed migration exits non-zero and aborts container
# startup (MADR-008).

[alembic]
script_location = %(here)s/alembic